<main><div class="container pagehead"><div class="eyebrow">2026 Postseason</div><h1>Playoff Bracket</h1><p class="muted">The regular season is complete. Series results populate here as playoff games are published.</p></div>
<div class="container"><div id="pictureMeta" class="picture-meta"></div><div id="pictureRoot"><div class="picture-empty">Loading playoff bracket…</div></div></div></main><footer><div class="container">ND Wiffle · 2026 Playoffs.</div></footer>
<script>
const LOGOS={"storm":"/assets/logos/storm.png?v=81","midnight":"/assets/logos/midnight.png?v=81","stiff-wifflers":"/assets/logos/stiff-wifflers.png?v=81","ball-busters":"/assets/logos/ball-busters.png?v=81","dirty-dawgs":"/assets/logos/dirty-dawgs.png?v=81","twin-titans":"/assets/logos/twin-titans.png?v=81","goofy-goobers":"/assets/logos/goofy-goobers.png?v=81","silverbacks":"/assets/logos/silverbacks.png?v=81","underdawgs":"/assets/logos/underdawgs.png?v=81","zyns":"/assets/logos/zyns.png?v=81"};
const FINAL_SEEDS=[
 {rank:1,team_id:"storm",team:"Storm",W:20,L:4},{rank:2,team_id:"ball-busters",team:"Ball Busters",W:17,L:7},{rank:3,team_id:"underdawgs",team:"Underdawgs",W:16,L:8},{rank:4,team_id:"twin-titans",team:"Twin Titans",W:13,L:11},{rank:5,team_id:"silverbacks",team:"Silverbacks",W:13,L:11},{rank:6,team_id:"midnight",team:"Midnight",W:11,L:13},{rank:7,team_id:"goofy-goobers",team:"Goofy Goobers",W:10,L:14}
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const seedById=id=>FINAL_SEEDS.find(x=>x.team_id===id),pairKey=(a,b)=>[a,b].sort().join("__");
function teamLine(t,sr=null){if(!t)return `<div class="seed-team"><div class="seed">—</div><span></span><div class="seed-name">TBD</div><div></div></div>`;const scores=sr?.games?.length?`<span class="team-game-scores">${sr.games.map(g=>{const val=t.team_id===sr.away_team_id?g.away_score:g.home_score;return `<span class="team-game-score">${val}</span>`}).join("")}</span>`:"";return `<div class="seed-team"><div class="seed">${t.rank}</div>${LOGOS[t.team_id]?`<img src="${LOGOS[t.team_id]}" alt="">`:"<span></span>"}<div class="seed-name">${esc(t.team)}</div><div class="seed-record"><span class="reg-record">${t.W}-${t.L}</span>${scores}</div></div>`}
function seriesFor(series,round,a,b){return (series||[]).find(x=>x.series_type==="playoff"&&x.playoff_round===round&&pairKey(x.away_team_id,x.home_team_id)===pairKey(a,b))}
function scheduledFor(rows,round,a,b){if(!a||!b)return null;return (rows||[]).find(x=>x.playoff_round===round&&pairKey(x.team_a_id,x.team_b_id)===pairKey(a,b))}
function fmtDate(v){if(!v)return "Date TBD";const d=new Date(v+"T12:00:00");return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function fmtTime(v){if(!v)return "Time TBD";const [h,m]=String(v).split(":").map(Number),d=new Date(2000,0,1,h,m);return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
function seriesWinner(sr){if(!sr||sr.series_status!=="complete")return null;return Number(sr.away_wins)>Number(sr.home_wins)?sr.away_team_id:sr.home_team_id}
function gameChips(sr){if(!sr?.games?.length)return "";return `<div class="series-games">${sr.games.map((g,i)=>`<span class="series-game">G${i+1} <strong>${g.away_score}-${g.home_score}</strong></span>`).join("")}</div>`}
function matchCard(a,b,label,sr=null,scheduled=null){const aw=Number(sr?.away_wins||0),hw=Number(sr?.home_wins||0),winner=seriesWinner(sr),sched=scheduled?`<div class="scheduled-banner"><b>Scheduled</b> · ${esc(scheduled.playoff_round)} · Best of ${Number(scheduled.playoff_series_length||3)} · ${fmtDate(scheduled.series_date)} · ${fmtTime(scheduled.series_time)}${scheduled.location?` · ${esc(scheduled.location)}`:""}</div>`:"";return `<div class="match ${winner?"bracket-champ":""} ${scheduled&&!sr?"scheduled-match":""}"><div class="match-label">${label}</div>${teamLine(a,sr)}${teamLine(b,sr)}${sr?gameChips(sr)+`<div class="series-final">Series: ${esc(sr.away_team)} ${aw}-${hw} ${esc(sr.home_team)}${winner?` · ${esc(seedById(winner)?.team||winner)} advances`:""}</div>`:""}${sched}</div>`}
function render(results,schedule){
 const po=(results?.series||[]).filter(x=>x.series_type==="playoff"),scheduled=(schedule?.playoffs||[]);
 const [s1,s2,s3,s4,s5,s6,s7]=FINAL_SEEDS;
 const q45=seriesFor(po,"First Round",s4.team_id,s5.team_id),q36=seriesFor(po,"First Round",s3.team_id,s6.team_id),q27=seriesFor(po,"First Round",s2.team_id,s7.team_id);
 const q45s=scheduledFor(scheduled,"First Round",s4.team_id,s5.team_id),q36s=scheduledFor(scheduled,"First Round",s3.team_id,s6.team_id),q27s=scheduledFor(scheduled,"First Round",s2.team_id,s7.team_id);
 const firstW=[seriesWinner(q45),seriesWinner(q36),seriesWinner(q27)].filter(Boolean).map(seedById).filter(Boolean).sort((a,b)=>a.rank-b.rank);
 let semi1A=s1,semi1B=null,semi2A=null,semi2B=null;
 if(firstW.length===3){semi1B=[...firstW].sort((a,b)=>b.rank-a.rank)[0];const rest=firstW.filter(x=>x.team_id!==semi1B.team_id).sort((a,b)=>a.rank-b.rank);semi2A=rest[0];semi2B=rest[1]}
 const sf1=semi1B?seriesFor(po,"Semifinal",semi1A.team_id,semi1B.team_id):null,sf2=semi2A&&semi2B?seriesFor(po,"Semifinal",semi2A.team_id,semi2B.team_id):null;
 const sf1s=semi1B?scheduledFor(scheduled,"Semifinal",semi1A.team_id,semi1B.team_id):null,sf2s=semi2A&&semi2B?scheduledFor(scheduled,"Semifinal",semi2A.team_id,semi2B.team_id):null;
 const fw=[seriesWinner(sf1),seriesWinner(sf2)].filter(Boolean).map(seedById).filter(Boolean).sort((a,b)=>a.rank-b.rank),fA=fw[0]||null,fB=fw[1]||null,ws=fA&&fB?seriesFor(po,"World Series",fA.team_id,fB.team_id):null,wsSched=fA&&fB?scheduledFor(scheduled,"World Series",fA.team_id,fB.team_id):null;
 const root=document.getElementById("pictureRoot");
 root.innerHTML=`<div class="bracket-wrap"><div class="bracket"><div class="round"><div class="round-title">First Round · Best of 3</div><div class="bye-card">${teamLine(s1)}<div class="bye-copy">First-round bye</div></div>${matchCard(s4,s5,"4 vs 5",q45,q45s)}${matchCard(s3,s6,"3 vs 6",q36,q36s)}${matchCard(s2,s7,"2 vs 7",q27,q27s)}</div><div class="connector"></div><div class="round semifinal-round"><div class="round-title">Semifinals · Best of 5</div>${matchCard(semi1A,semi1B,"Semifinal 1",sf1,sf1s)}${matchCard(semi2A,semi2B,"Semifinal 2",sf2,sf2s)}</div><div class="connector"></div><div class="round final-round"><div class="round-title">World Series · Best of 7</div>${matchCard(fA,fB,"World Series",ws,wsSched)}</div></div></div>`;
 const complete=po.filter(x=>x.series_status==="complete").length;document.getElementById("pictureMeta").innerHTML=`<span class="picture-chip"><strong>7</strong> playoff teams</span><span class="picture-chip"><strong>${scheduled.length}</strong> scheduled playoff series</span><span class="picture-chip"><strong>${complete}</strong> completed playoff series</span><span class="picture-chip">#1 Storm receives a bye</span>`;
}
Promise.all([fetch("/api/public/results?season=2026",{cache:"no-store"}).then(r=>r.json()),fetch("/api/public/schedule?season=2026",{cache:"no-store"}).then(r=>r.json())]).then(([results,schedule])=>{if(!results.ok)throw new Error(results.error);if(!schedule.ok)throw new Error(schedule.error);render(results,schedule)}).catch(e=>{console.error(e);render({series:[]},{playoffs:[]})});
</script><script src="/assets/hof.js?v=149"></script></body></html>

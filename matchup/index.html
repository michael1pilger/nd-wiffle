<script>
const LOGOS={"storm":"/assets/logos/storm.png?v=81","midnight":"/assets/logos/midnight.png?v=81","stiff-wifflers":"/assets/logos/stiff-wifflers.png?v=81","ball-busters":"/assets/logos/ball-busters.png?v=81","dirty-dawgs":"/assets/logos/dirty-dawgs.png?v=81","twin-titans":"/assets/logos/twin-titans.png?v=81","goofy-goobers":"/assets/logos/goofy-goobers.png?v=81","silverbacks":"/assets/logos/silverbacks.png?v=81","underdawgs":"/assets/logos/underdawgs.png?v=81","zyns":"/assets/logos/zyns.png?v=81"};
const MATCH_TEAM_RGB={"storm":"96,0,160","midnight":"90,98,110","stiff-wifflers":"24,49,83","ball-busters":"144,32,32","dirty-dawgs":"96,0,24","twin-titans":"64,80,112","goofy-goobers":"208,80,32","silverbacks":"192,160,80","underdawgs":"64,48,96","zyns":"144,224,224"};

const qp=new URLSearchParams(location.search),awayId=qp.get("away"),homeId=qp.get("home"),seriesId=qp.get("series"),scheduledDate=qp.get("date");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num=v=>Number(v||0),visibleName=n=>String(n||"").trim().toLowerCase()!=="max partovi";
function fmtPct(v){return Number(v||0).toFixed(3).replace(/^0/,"")}
function fmtDate(v){if(!v||v==="TBD")return "Date TBD";const d=new Date(`${v}T12:00:00`);return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}
function rosterMap(rosters){
 const m=new Map();
 for(const p of rosters||[]){
  if(!visibleName(p.name))continue;
  if(!m.has(p.team_id))m.set(p.team_id,[]);
  m.get(p.team_id).push(p);
 }
 return m;
}
function currentTeamPlayers(rows,rosterRows){
 const ids=new Set((rosterRows||[]).map(x=>x.player_id));
 return (rows||[]).filter(r=>visibleName(r.Name)&&ids.has(r.Player_ID));
}
function topBat(rows){return [...rows].sort((a,b)=>num(b.OPS)-num(a.OPS)||num(b.PAs)-num(a.PAs)||num(b.HRs)-num(a.HRs)).slice(0,3)}
function topPit(rows){return [...rows].filter(r=>num(r.Outs)>0).sort((a,b)=>num(a.ERA)-num(b.ERA)||num(b.Ks)-num(a.Ks)||num(b.Outs)-num(a.Outs)).slice(0,3)}
function careerPlayerIds(rosterRows){
 const names=new Set((rosterRows||[]).map(x=>String(x.name||"").trim().toLowerCase()));
 return new Set((window.ND_DATA?.players||[]).filter(p=>names.has(String(p.Name||"").trim().toLowerCase())).map(p=>p.Player_ID));
}
function careerBatters(rosterRows){
 const ids=careerPlayerIds(rosterRows);
 return (window.ND_DATA?.batting||[]).filter(r=>visibleName(r.Name)&&ids.has(r.Player_ID)&&num(r.PAs)>0);
}
function careerPitchers(rosterRows){
 const ids=careerPlayerIds(rosterRows);
 return (window.ND_DATA?.pitching||[]).filter(r=>visibleName(r.Name)&&ids.has(r.Player_ID)&&num(r.IP)>0);
}
function topCareerBat(rows){return [...rows].sort((a,b)=>num(b.OPS)-num(a.OPS)||num(b.PAs)-num(a.PAs)||num(b.HRs)-num(a.HRs)).slice(0,3)}
function topCareerPit(rows){return [...rows].sort((a,b)=>num(a.ERA)-num(b.ERA)||num(b.Ks)-num(a.Ks)||num(b.IP)-num(a.IP)).slice(0,3)}
function leaderRows(rows,type,career=false){
 return rows.map((r,i)=>`<div class="leader-row"><div class="rank">${i+1}</div><div><strong>${esc(r.Name)}</strong><small>${type==="bat"?`${r.PAs} PA · ${r.HRs} HR · ${r.RBI} RBI`:`${r.IP} IP · ${r.Ks} K · ${r.W}-${r.L}`}</small></div><div class="leader-val">${type==="bat"?`${Number(r.OPS).toFixed(3).replace(/^0/,"")} OPS`:`${Number(r.ERA).toFixed(2)} ERA`}</div></div>`).join("")||`<div class="muted">${career?"No historical stats available.":"No published 2026 stats yet."}</div>`;
}

function expectedPitchers(rows){
 return [...(rows||[])].filter(r=>num(r.Outs)>0).sort((a,b)=>num(b.Starts)-num(a.Starts)||num(b.Outs)-num(a.Outs)||num(a.ERA)-num(b.ERA)||num(b.Ks)-num(a.Ks)).slice(0,2);
}
function teamBatProfile(rows,standRow){
 const pa=rows.reduce((a,r)=>a+num(r.PAs),0),ab=rows.reduce((a,r)=>a+num(r.ABs),0),h=rows.reduce((a,r)=>a+num(r.Hits),0),bb=rows.reduce((a,r)=>a+num(r.BB),0),k=rows.reduce((a,r)=>a+num(r.Ks),0),hr=rows.reduce((a,r)=>a+num(r.HRs),0),singles=rows.reduce((a,r)=>a+num(r.Singles),0),doubles=rows.reduce((a,r)=>a+num(r.Doubles),0),triples=rows.reduce((a,r)=>a+num(r.Triples),0),tb=singles+2*doubles+3*triples+4*hr;
 const obp=pa?(h+bb)/pa:0,slg=ab?tb/ab:0;
 return {PA:pa,BA:ab?h/ab:0,OBP:obp,SLG:slg,OPS:obp+slg,BBpct:pa?bb/pa:0,Kpct:pa?k/pa:0,HRpct:pa?hr/pa:0,Hpct:pa?h/pa:0,RunsPerGame:num(standRow?.GP)?num(standRow?.RS)/num(standRow.GP):0};
}
function pitcherRates(p){const bf=num(p.BF);return {BBpct:bf?num(p.Walks)/bf:0,Kpct:bf?num(p.Ks)/bf:0,HRpct:bf?num(p.HRs)/bf:0,Hpct:bf?num(p.Hits)/bf:0}}
function pct1(v){return `${(100*num(v)).toFixed(1)}%`}
function rateCompare(label,pitcherValue,teamValue,pitcherLabel,teamLabel){return `<div class="rate-compare"><small>${label}</small><strong>${pct1(pitcherValue)} <span>vs</span> ${pct1(teamValue)}</strong><small>${esc(pitcherLabel)} · ${esc(teamLabel)}</small></div>`}
function pitcherCard(p,opponent,oppBatRows){
 const rates=pitcherRates(p),team=teamBatProfile(oppBatRows,opponent),fip=p.FIP!==null&&p.FIP!==undefined&&p.FIP!==""?Number(p.FIP):(num(p.Outs)>0?(13*num(p.HRs)+3*num(p.Walks)-2*num(p.Ks))/num(p.Outs):null);
 return `<article class="pitch-card"><div class="pitch-card-head"><div><h3>${esc(p.Name)}</h3><div class="pitch-card-sub">${p.Starts||0} starts · ${p.Apps||0} apps · ${p.IP||"0"} IP · ${p.W||0}-${p.L||0}${num(p.S)?` · ${p.S} SV`:""}</div></div><div style="font-size:9px;color:var(--muted)">vs ${esc(opponent.team)}</div></div><div class="pitch-core"><div><small>ERA</small><strong>${p.ERA===null||p.ERA===undefined?"—":Number(p.ERA).toFixed(2)}</strong></div><div><small>WHIP</small><strong>${p.WHIP===null||p.WHIP===undefined?"—":Number(p.WHIP).toFixed(2)}</strong></div><div><small>FIP</small><strong>${fip===null?"—":fip.toFixed(3)}</strong></div><div><small>K</small><strong>${p.Ks||0}</strong></div></div><div class="rate-grid">${rateCompare("Walk rate",rates.BBpct,team.BBpct,`${p.Name} BB/BF`,`${opponent.team} BB/PA`)}${rateCompare("Strikeout rate",rates.Kpct,team.Kpct,`${p.Name} K/BF`,`${opponent.team} K/PA`)}${rateCompare("HR rate",rates.HRpct,team.HRpct,`${p.Name} HR/BF`,`${opponent.team} HR/PA`)}${rateCompare("Hit rate",rates.Hpct,team.Hpct,`${p.Name} H/BF`,`${opponent.team} H/PA`)}</div><div class="team-bat-profile"><strong>${esc(opponent.team)} 2026 offense:</strong> ${team.PA} PA · ${fmtPct(team.BA)} BA · ${fmtPct(team.OBP)} OBP · ${fmtPct(team.SLG)} SLG · ${fmtPct(team.OPS)} OPS · ${team.RunsPerGame.toFixed(2)} R/G</div></article>`;
}
function pitcherPreviewSection(away,home,awayPitchers,homePitchers,awayBatRows,homeBatRows){
 const awayCards=awayPitchers.map(p=>pitcherCard(p,home,homeBatRows)).join(""),homeCards=homePitchers.map(p=>pitcherCard(p,away,awayBatRows)).join("");
 if(!awayCards&&!homeCards)return "";
 return `<section class="pitch-preview-section"><div class="pitch-preview-head"><div class="eyebrow">Probable Pitching Matchups</div><h2>Top Two Pitchers vs Opposing 2026 Offense</h2><p>Pitchers are selected by 2026 starts, then innings pitched. Rate comparisons use each pitcher's cumulative batters faced and the opponent's cumulative 2026 plate appearances.</p></div>${awayCards?`<div class="pitch-team-block"><h3 class="pitch-team-title">${esc(away.team)} pitchers vs ${esc(home.team)} hitters</h3><div class="pitch-preview-grid">${awayCards}</div></div>`:""}${homeCards?`<div class="pitch-team-block"><h3 class="pitch-team-title">${esc(home.team)} pitchers vs ${esc(away.team)} hitters</h3><div class="pitch-preview-grid">${homeCards}</div></div>`:""}</section>`;
}
function seriesWins(games){
  let away=0,home=0;
  for(const g of games||[]){
    const a=Number(g.away_score||0),h=Number(g.home_score||0);
    if(a>h)away++;else if(h>a)home++;
  }
  return {away,home};
}
function groupSeries(games){const map=new Map();for(const g of games||[]){let x=map.get(g.series_id);if(!x){x={id:g.series_id,date:g.series_date,away:g.away_team_id,home:g.home_team_id,awayName:g.away_team,homeName:g.home_team,games:[]};map.set(g.series_id,x)}x.games.push(g)}return [...map.values()]}
function recentForm(series,teamId){return series.filter(s=>s.away===teamId||s.home===teamId).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,3).map(s=>{let w=0,l=0;for(const g of s.games){const teamAway=s.away===teamId,us=teamAway?num(g.away_score):num(g.home_score),them=teamAway?num(g.home_score):num(g.away_score);us>them?w++:l++}return {opp:s.away===teamId?s.homeName:s.awayName,w,l,won:w>l}})}
function formHtml(rows){return `<div class="form-list">${rows.length?rows.map(x=>`<span class="form-pill ${x.won?"win":"loss"}">${x.won?"W":"L"} ${x.w}-${x.l} vs ${esc(x.opp)}</span>`).join(""):'<span class="muted">No completed series yet.</span>'}</div>`}
function snapshot(t){return `<div class="snapshot-card"><h2>${esc(t.team)}</h2><div class="snapshot-stats"><div class="snapshot-stat"><small>Rank</small><strong>#${t.rank}</strong></div><div class="snapshot-stat"><small>Record</small><strong>${t.W}-${t.L}</strong></div><div class="snapshot-stat"><small>PCT</small><strong>${fmtPct(t.PCT)}</strong></div><div class="snapshot-stat"><small>Run Diff</small><strong>${t.DIFF>0?"+":""}${t.DIFF}</strong></div></div></div>`}
function teamHero(t){return `<div class="match-team">${LOGOS[t.team_id]?`<img src="${LOGOS[t.team_id]}" alt="">`:""}<h1>${esc(t.team)}</h1><div class="match-record">#${t.rank} · ${t.W}-${t.L} · ${fmtPct(t.PCT)}</div></div>`}
function completedResult(results){return (results.series||[]).find(s=>seriesId?s.series_id===seriesId:(new Set([s.away_team_id,s.home_team_id]).has(awayId)&&new Set([s.away_team_id,s.home_team_id]).has(homeId)))}
function render(data,results,rosters){
 const standings=data.standings||[],away=standings.find(x=>x.team_id===awayId),home=standings.find(x=>x.team_id===homeId);
 if(!away||!home){document.getElementById("matchRoot").innerHTML='<div class="match-empty">This matchup could not be found.</div>';return}
 document.title=`${away.team} at ${home.team} | ND Wiffle`;
 const rosterByTeam=rosterMap(rosters.rosters||[]),awayRoster=rosterByTeam.get(awayId)||[],homeRoster=rosterByTeam.get(homeId)||[];
 const awayAll2026Bat=currentTeamPlayers(data.batting,awayRoster),homeAll2026Bat=currentTeamPlayers(data.batting,homeRoster);
 const awayAll2026Pit=currentTeamPlayers(data.pitching,awayRoster),homeAll2026Pit=currentTeamPlayers(data.pitching,homeRoster);
 const away2026Bat=topBat(awayAll2026Bat),home2026Bat=topBat(homeAll2026Bat);
 const away2026Pit=topPit(awayAll2026Pit),home2026Pit=topPit(homeAll2026Pit);
 const awayExpectedPit=expectedPitchers(awayAll2026Pit),homeExpectedPit=expectedPitchers(homeAll2026Pit);
 const series=groupSeries(data.games),awayForm=recentForm(series,awayId),homeForm=recentForm(series,homeId);
 const headToHead=series.some(x=>new Set([x.away,x.home]).has(awayId)&&new Set([x.away,x.home]).has(homeId));
 const awayCareerBat=!away2026Bat.length,homeCareerBat=!home2026Bat.length,awayCareerPit=!away2026Pit.length,homeCareerPit=!home2026Pit.length;
 const awayBat=away2026Bat.length?away2026Bat:topCareerBat(careerBatters(awayRoster));
 const homeBat=home2026Bat.length?home2026Bat:topCareerBat(careerBatters(homeRoster));
 const awayPit=away2026Pit.length?away2026Pit:topCareerPit(careerPitchers(awayRoster));
 const homePit=home2026Pit.length?home2026Pit:topCareerPit(careerPitchers(homeRoster));
 const finished=completedResult(results),status=finished?"Final":scheduledDate&&scheduledDate!=="TBD"?fmtDate(scheduledDate):"Matchup Preview";
 let finalHtml="";
 if(finished){
   const games=(finished.games||[]).map(g=>`<div class="series-game"><small>Game ${g.game_number}</small><strong>${esc(finished.away_team)} ${g.away_score} · ${esc(finished.home_team)} ${g.home_score}</strong></div>`).join("");
   const sw=seriesWins(finished.games),awayWon=sw.away>sw.home,winner=awayWon?finished.away_team:finished.home_team,winnerId=awayWon?finished.away_team_id:finished.home_team_id,rgb=MATCH_TEAM_RGB[winnerId]||"90,98,110";
   finalHtml=`<section class="series-result" style="--winner-rgb:${rgb}"><h2>${esc(winner)} won the series ${Math.max(sw.away,sw.home)}–${Math.min(sw.away,sw.home)}</h2><div class="muted">${fmtDate(finished.series_date)}</div><div class="series-games">${games}</div><a class="result-link" href="/results/?series=${encodeURIComponent(finished.series_id)}">View full box score →</a></section>`;
 }
 document.getElementById("matchRoot").innerHTML=`<section class="match-hero"><div class="match-status">${esc(status)}</div><div class="match-teams">${teamHero(away)}<div class="match-at">at</div>${teamHero(home)}</div></section>${finalHtml}
 ${pitcherPreviewSection(away,home,awayExpectedPit,homeExpectedPit,awayAll2026Bat,homeAll2026Bat)}
 <div class="snapshot-grid">${snapshot(away)}${snapshot(home)}</div>
 <div class="compare-grid">
  <section class="compare-card"><h2>${esc(away.team)}</h2><div class="leader-section"><div class="leader-box"><h3>${awayCareerBat?"Career Top Hitters":"2026 Top Hitters"}${awayCareerBat?"<small>Historical career stats for active roster</small>":""}</h3>${leaderRows(awayBat,"bat",awayCareerBat)}</div><div class="leader-box"><h3>${awayCareerPit?"Career Top Pitchers":"2026 Top Pitchers"}${awayCareerPit?"<small>Historical career stats for active roster</small>":""}</h3>${leaderRows(awayPit,"pit",awayCareerPit)}</div></div>${!headToHead?'<div class="history-note">No prior 2026 head-to-head series. Historical career production is used where current-season stats are not yet available.</div>':""}<h3 style="font-size:11px;text-transform:uppercase;color:var(--gold);margin:13px 0 7px">Recent Form</h3>${formHtml(awayForm)}</section>

 fetch("/api/public/league?season=2026",{cache:"no-store"}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"League data unavailable");return j}),
 fetch("/api/public/results?season=2026",{cache:"no-store"}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Results unavailable");return j}),

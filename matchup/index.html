<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchup | ND Wiffle</title><link rel="stylesheet" href="/assets/styles.css?v=48">
<style>
.match-back{display:inline-flex;gap:6px;align-items:center;color:var(--gold);font-size:12px;font-weight:900;text-decoration:none;margin-bottom:16px}
.match-hero{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:20px;margin-bottom:16px}
.match-status{text-align:center;color:var(--gold);font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.match-teams{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:16px;align-items:center}
.match-team{text-align:center;min-width:0}.match-team img{width:92px;height:92px;object-fit:contain}.match-team h1{font-size:25px;margin:7px 0 4px}.match-record{font-size:13px;color:var(--muted)}
.match-at{text-align:center;color:var(--muted);font-size:12px;font-weight:950;text-transform:uppercase}
.snapshot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.snapshot-card{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:14px}.snapshot-card h2{font-size:17px;margin:0 0 10px}
.snapshot-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.snapshot-stat{background:#0b1525;border-radius:9px;padding:9px;text-align:center}.snapshot-stat small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;font-weight:850}.snapshot-stat strong{display:block;font-size:17px;margin-top:3px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.compare-card{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:14px}.compare-card h2{font-size:17px;margin:0 0 10px}
.leader-section{display:grid;grid-template-columns:1fr 1fr;gap:10px}.leader-box{background:#0b1525;border-radius:10px;padding:10px}.leader-box h3{color:var(--gold);font-size:10px;text-transform:uppercase;margin:0 0 7px}
.leader-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}.leader-row:last-child{border:0}.leader-row .rank{color:var(--muted);font-weight:900}.leader-row strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.leader-row small{color:var(--muted);font-size:9px}.leader-val{text-align:right;font-size:11px;font-weight:900}
.form-list{display:flex;gap:6px;flex-wrap:wrap}.form-pill{border-radius:999px;padding:6px 8px;font-size:10px;font-weight:900;background:#0b1525;border:1px solid var(--border)}.form-pill.win{color:#74d49d}.form-pill.loss{color:#eb7884}
.series-result{border:1px solid rgba(215,173,72,.34);background:rgba(215,173,72,.05);border-radius:14px;padding:14px;margin-bottom:16px}.series-result h2{font-size:18px;margin:0 0 8px}.series-games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.series-game{background:#0b1525;border-radius:9px;padding:9px}.series-game small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase}.series-game strong{display:block;margin-top:4px}.result-link{display:inline-flex;margin-top:11px;color:var(--gold);font-weight:900;font-size:11px;text-decoration:none}
.match-empty{border:1px dashed var(--border);border-radius:14px;padding:20px;color:var(--muted)}
@media(max-width:800px){.snapshot-grid,.compare-grid{grid-template-columns:1fr}.match-teams{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr)}.match-team img{width:68px;height:68px}.match-team h1{font-size:19px}.leader-section{grid-template-columns:1fr}}
@media(max-width:520px){.snapshot-stats{grid-template-columns:repeat(2,1fr)}.series-games{grid-template-columns:1fr}}
</style></head><body>
<div class="sitebar"><div class="container nav"><a class="logo" href="/">ND WIFFLE</a><div class="links"><a href="/schedule/">'26 Schedule</a><a href="/standings/">'26 Standings</a><a href="/playoffs/">Playoffs</a><a href="/results/">Results</a><a href="/leaders/">Leaders</a><a href="/draft/">Draft</a><a href="/teams/">Teams</a><a href="/players/">Players</a><a href="/awards/">Awards</a><a href="/grid/">Grid</a><a href="/stats/">Stats</a></div></div></div>
<main><div class="container pagehead"><a class="match-back" href="javascript:history.back()">← Back</a><div class="eyebrow">2026 Matchup</div><h1>Matchup Preview</h1><p class="muted">Current records, team form, and player leaders for this matchup.</p></div>
<div class="container"><div id="matchRoot"><div class="match-empty">Loading matchup…</div></div></div></main>
<footer><div class="container">ND Wiffle · Matchup details.</div></footer>
<script>
const LOGOS={"storm":"/assets/logos/storm.png?v=48","midnight":"/assets/logos/midnight.png?v=48","stiff-wifflers":"/assets/logos/stiff-wifflers.png?v=48","ball-busters":"/assets/logos/ball-busters.png?v=48","dirty-dawgs":"/assets/logos/dirty-dawgs.png?v=48","twin-titans":"/assets/logos/twin-titans.png?v=48","goofy-goobers":"/assets/logos/goofy-goobers.png?v=48","silverbacks":"/assets/logos/silverbacks.png?v=48","underdawgs":"/assets/logos/underdawgs.png?v=48","zyns":"/assets/logos/zyns.png?v=48"};
const qp=new URLSearchParams(location.search),awayId=qp.get("away"),homeId=qp.get("home"),seriesId=qp.get("series"),scheduledDate=qp.get("date");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num=v=>Number(v||0),visibleName=n=>String(n||"").trim().toLowerCase()!=="max partovi";
function fmtPct(v){return Number(v||0).toFixed(3).replace(/^0/,"")}
function fmtDate(v){if(!v||v==="TBD")return "Date TBD";const d=new Date(`${v}T12:00:00`);return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}
function playerTeams(data){const m=new Map();for(const p of data.participants||[]){if(!visibleName(p.name))continue;(m.get(p.team_id)??m.set(p.team_id,new Set()).get(p.team_id)).add(p.player_id)}return m}
function teamPlayers(rows,set){return (rows||[]).filter(r=>visibleName(r.Name)&&set?.has(r.Player_ID))}
function topBat(rows){return [...rows].sort((a,b)=>num(b.OPS)-num(a.OPS)||num(b.PAs)-num(a.PAs)||num(b.HRs)-num(a.HRs)).slice(0,3)}
function topPit(rows){return [...rows].filter(r=>num(r.Outs)>0).sort((a,b)=>num(a.ERA)-num(b.ERA)||num(b.Ks)-num(a.Ks)||num(b.Outs)-num(a.Outs)).slice(0,3)}
function leaderRows(rows,type){return rows.map((r,i)=>`<div class="leader-row"><div class="rank">${i+1}</div><div><strong>${esc(r.Name)}</strong><small>${type==="bat"?`${r.PAs} PA · ${r.HRs} HR · ${r.RBI} RBI`:`${r.IP} IP · ${r.Ks} K · ${r.W}-${r.L}`}</small></div><div class="leader-val">${type==="bat"?`${Number(r.OPS).toFixed(3).replace(/^0/,"")} OPS`:`${r.ERA} ERA`}</div></div>`).join("")||'<div class="muted">No published stats yet.</div>'}
function groupSeries(games){const map=new Map();for(const g of games||[]){let x=map.get(g.series_id);if(!x){x={id:g.series_id,date:g.series_date,away:g.away_team_id,home:g.home_team_id,awayName:g.away_team,homeName:g.home_team,games:[]};map.set(g.series_id,x)}x.games.push(g)}return [...map.values()]}
function recentForm(series,teamId){return series.filter(s=>s.away===teamId||s.home===teamId).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,3).map(s=>{let w=0,l=0;for(const g of s.games){const teamAway=s.away===teamId,us=teamAway?num(g.away_score):num(g.home_score),them=teamAway?num(g.home_score):num(g.away_score);us>them?w++:l++}return {opp:s.away===teamId?s.homeName:s.awayName,w,l,won:w>l}})}
function formHtml(rows){return `<div class="form-list">${rows.length?rows.map(x=>`<span class="form-pill ${x.won?"win":"loss"}">${x.won?"W":"L"} ${x.w}-${x.l} vs ${esc(x.opp)}</span>`).join(""):'<span class="muted">No completed series yet.</span>'}</div>`}
function snapshot(t){return `<div class="snapshot-card"><h2>${esc(t.team)}</h2><div class="snapshot-stats"><div class="snapshot-stat"><small>Rank</small><strong>#${t.rank}</strong></div><div class="snapshot-stat"><small>Record</small><strong>${t.W}-${t.L}</strong></div><div class="snapshot-stat"><small>PCT</small><strong>${fmtPct(t.PCT)}</strong></div><div class="snapshot-stat"><small>Run Diff</small><strong>${t.DIFF>0?"+":""}${t.DIFF}</strong></div></div></div>`}
function teamHero(t){return `<div class="match-team">${LOGOS[t.team_id]?`<img src="${LOGOS[t.team_id]}" alt="">`:""}<h1>${esc(t.team)}</h1><div class="match-record">#${t.rank} · ${t.W}-${t.L} · ${fmtPct(t.PCT)}</div></div>`}
function completedResult(results){return (results.series||[]).find(s=>seriesId?s.series_id===seriesId:(s.away_team_id===awayId&&s.home_team_id===homeId))}
function render(data,results){
 const standings=data.standings||[],away=standings.find(x=>x.team_id===awayId),home=standings.find(x=>x.team_id===homeId);
 if(!away||!home){document.getElementById("matchRoot").innerHTML='<div class="match-empty">This matchup could not be found.</div>';return}
 document.title=`${away.team} at ${home.team} | ND Wiffle`;
 const teams=playerTeams(data),awaySet=teams.get(awayId),homeSet=teams.get(homeId);
 const awayBat=topBat(teamPlayers(data.batting,awaySet)),homeBat=topBat(teamPlayers(data.batting,homeSet));
 const awayPit=topPit(teamPlayers(data.pitching,awaySet)),homePit=topPit(teamPlayers(data.pitching,homeSet));
 const series=groupSeries(data.games),awayForm=recentForm(series,awayId),homeForm=recentForm(series,homeId);
 const finished=completedResult(results),status=finished?"Final":scheduledDate&&scheduledDate!=="TBD"?fmtDate(scheduledDate):"Matchup Preview";
 let finalHtml="";
 if(finished){
   const games=(finished.games||[]).map(g=>`<div class="series-game"><small>Game ${g.game_number}</small><strong>${esc(finished.away_team)} ${g.away_score} · ${esc(finished.home_team)} ${g.home_score}</strong></div>`).join("");
   const winner=finished.away_wins>finished.home_wins?finished.away_team:finished.home_team;
   finalHtml=`<section class="series-result"><h2>${esc(winner)} won the series ${Math.max(finished.away_wins,finished.home_wins)}–${Math.min(finished.away_wins,finished.home_wins)}</h2><div class="muted">${fmtDate(finished.series_date)}</div><div class="series-games">${games}</div><a class="result-link" href="/results/?series=${encodeURIComponent(finished.series_id)}">View full box score →</a></section>`;
 }
 document.getElementById("matchRoot").innerHTML=`<section class="match-hero"><div class="match-status">${esc(status)}</div><div class="match-teams">${teamHero(away)}<div class="match-at">at</div>${teamHero(home)}</div></section>${finalHtml}
 <div class="snapshot-grid">${snapshot(away)}${snapshot(home)}</div>
 <div class="compare-grid">
  <section class="compare-card"><h2>${esc(away.team)}</h2><div class="leader-section"><div class="leader-box"><h3>Top Hitters</h3>${leaderRows(awayBat,"bat")}</div><div class="leader-box"><h3>Top Pitchers</h3>${leaderRows(awayPit,"pit")}</div></div><h3 style="font-size:11px;text-transform:uppercase;color:var(--gold);margin:13px 0 7px">Recent Form</h3>${formHtml(awayForm)}</section>
  <section class="compare-card"><h2>${esc(home.team)}</h2><div class="leader-section"><div class="leader-box"><h3>Top Hitters</h3>${leaderRows(homeBat,"bat")}</div><div class="leader-box"><h3>Top Pitchers</h3>${leaderRows(homePit,"pit")}</div></div><h3 style="font-size:11px;text-transform:uppercase;color:var(--gold);margin:13px 0 7px">Recent Form</h3>${formHtml(homeForm)}</section>
 </div>`;
}
if(!awayId||!homeId){document.getElementById("matchRoot").innerHTML='<div class="match-empty">No matchup was selected.</div>'}
else Promise.all([
 fetch("/api/public/league?season=2026",{cache:"no-store"}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"League data unavailable");return j}),
 fetch("/api/public/results?season=2026",{cache:"no-store"}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Results unavailable");return j})
]).then(([data,results])=>render(data,results)).catch(err=>{console.error(err);document.getElementById("matchRoot").innerHTML='<div class="match-empty">Matchup details are temporarily unavailable.</div>'});
</script></body></html>

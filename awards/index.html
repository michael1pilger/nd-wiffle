<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awards | ND Wiffle</title><link rel="stylesheet" href="/assets/styles.css"></head><body>
<div class="sitebar"><div class="container nav"><a class="logo" href="/">ND WIFFLE</a><div class="links"><a class="" href="/schedule/">'26 Schedule</a><a class="" href="/standings/">'26 Standings</a><a class="" href="/teams/">Teams</a><a class="" href="/players/">Players</a><a class="active" href="/awards/">Awards</a><a class="" href="/grid/">Grid</a><a class="" href="/stats/">Stats</a></div></div></div>

<main>
<div class="container pagehead"><div class="eyebrow">League History</div><h1>Awards & Champions</h1>
<p class="muted">Award history from 2021–2025, with repeat winners highlighted.</p></div>
<div class="container">
  <div class="sectionhead"><h2>Repeat Award Winners</h2></div>
  <div id="awardSummary" class="award-summary-grid"></div>
  <div class="sectionhead"><h2>Year-by-Year</h2></div>
  <div id="awardYears" class="awards-compact"></div>
</div>
</main>
<script src="/assets/data.js"></script>
<script>
const excluded=new Set(["All-Star","World Series Champion"]);
const counts={};
for(const a of (ND_DATA.awards||[])){
 if(excluded.has(a.Award))continue;
 const key=a.Player_ID+"|"+a.Player_Name+"|"+a.Award;
 counts[key]=(counts[key]||0)+1;
}
const repeat=Object.entries(counts)
 .filter(([k,v])=>v>1)
 .map(([k,v])=>{const [id,name,award]=k.split("|");return {id,name,award,count:v};})
 .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
awardSummary.innerHTML=repeat.map(x=>`<div class="award-summary-card">
 <div class="count">${x.count}×</div><div class="who">${x.name}</div><div class="detail">${x.award}</div>
</div>`).join("");

const byYear={};
for(const a of (ND_DATA.awards||[])){(byYear[a.Season]??=[]).push(a);}
awardYears.innerHTML=Object.keys(byYear).sort((a,b)=>b-a).map(y=>{
 const rows=byYear[y].map(a=>`<tr><td>${a.Award}</td><td>${a.Player_Name}</td><td>${a.Detail||""}</td></tr>`).join("");
 return `<div class="award-year">${y}</div><div class="tablewrap"><table>
 <thead><tr><th>Award</th><th>Player</th><th>Detail</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}).join("");
</script>
<footer><div class="container">ND Wiffle · Historical league database, 2021–2025.</div></footer></body></html>

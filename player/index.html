<link rel="stylesheet" href="/assets/styles.css?v=81">
<style>
.profile{padding:26px 0 50px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;border:1px solid var(--border);border-radius:16px;background:linear-gradient(135deg,#0c1729,#08111f);padding:18px}
.headshot{width:140px;height:140px;object-fit:contain;border-radius:13px;background:#050a10;border:1px solid rgba(255,255,255,.08)}
.hero h1{font-size:38px;margin:0 0 4px}.meta{color:var(--muted);font-size:11px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--border);border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;background:#111e32}
.section{margin-top:18px;border:1px solid var(--border);border-radius:14px;background:#0b1525;padding:14px}
.section h2{margin:0 0 10px;font-size:19px}
.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.insight{border:1px solid rgba(255,255,255,.08);border-radius:11px;background:#08111f;padding:11px}
.insight h3{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 7px}
.insight ul{padding-left:17px;margin:0;font-size:11px;line-height:1.7}
.stat-wrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:10px}
.br-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:10px}
.br-table th{position:sticky;top:0;background:#111d2d;color:#e8edf5;border-bottom:1px solid var(--border);padding:7px 8px;text-align:right;white-space:nowrap}
.br-table th:first-child,.br-table th:nth-child(2){text-align:left}
.br-table td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.055);text-align:right;white-space:nowrap}
.br-table td:first-child,.br-table td:nth-child(2){text-align:left}
.br-table tbody tr:hover{background:rgba(255,255,255,.035)}
.br-table .career{font-weight:900;background:rgba(215,173,72,.07)}
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.summary div{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px;background:#08111f;text-align:center}
.summary strong{display:block;font-size:18px}.summary span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted);padding:13px 0;font-size:10px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.headshot{width:110px;height:110px}.insight-grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

</div></main>

<script src="/assets/data.js?v=81"></script>
<script>
const qs=new URLSearchParams(location.search),PLAYER_ID=qs.get("id")||"";
let LIVE=null;
const HEADSHOTS={"adam_skrzypczyck":"/assets/headshots/adam_skrzypczyck.png","alex_rivera":"/assets/headshots/alex_rivera.png","andrew_frey":"/assets/headshots/andrew_frey.png","andrew_letherman":"/assets/headshots/andrew_letherman.png","anthony_bellone":"/assets/headshots/anthony_bellone.png","ben_meyer":"/assets/headshots/ben_meyer.png","bennett_alvarado":"/assets/headshots/bennett_alvarado.png","bennett_ruskusky":"/assets/headshots/bennett_ruskusky.png","bobby_wolff":"/assets/headshots/bobby_wolff.png","brady_cahill":"/assets/headshots/brady_cahill.png","brendan_mato":"/assets/headshots/brendan_mato.png","charlie_doherty":"/assets/headshots/charlie_doherty.png","chase_niemeyer":"/assets/headshots/chase_niemeyer.png","christopher_marvel":"/assets/headshots/christopher_marvel.png","collin_barker":"/assets/headshots/collin_barker.png","connor_savage":"/assets/headshots/connor_savage.png","dean_zervos":"/assets/headshots/dean_zervos.png","diego_alonso":"/assets/headshots/diego_alonso.png","eddie_mcgettigan":"/assets/headshots/eddie_mcgettigan.png","evan_reid":"/assets/headshots/evan_reid.png","freddy_zeckser":"/assets/headshots/freddy_zeckser.png","george_devlin":"/assets/headshots/george_devlin.png","gerard_sharkey":"/assets/headshots/gerard_sharkey.png","ian_phelps":"/assets/headshots/ian_phelps.png","isaac_oswald":"/assets/headshots/isaac_oswald.png","jack_conners":"/assets/headshots/jack_conners.png","jacob_bailey":"/assets/headshots/jacob_bailey.png","jacob_clark":"/assets/headshots/jacob_clark.png","jacob_olejnik":"/assets/headshots/jacob_olejnik.png","jaden_lukose":"/assets/headshots/jaden_lukose.png","jason_marrs":"/assets/headshots/jason_marrs.png","jeb_blanco":"/assets/headshots/jeb_blanco.png","jerry_vielhauer":"/assets/headshots/jerry_vielhauer.png","jimmy_redfern":"/assets/headshots/jimmy_redfern.png","jimmy_szpak":"/assets/headshots/jimmy_szpak.png","joe_dachnowicz":"/assets/headshots/joe_dachnowicz.png","joey_thomalla":"/assets/headshots/joey_thomalla.png","johnny_carey":"/assets/headshots/johnny_carey.png","jose_aranda":"/assets/headshots/jose_aranda.png","jt_kaiser":"/assets/headshots/jt_kaiser.png","kirby_bach":"/assets/headshots/kirby_bach.png","landon_edwards":"/assets/headshots/landon_edwards.png","logan_bettinger":"/assets/headshots/logan_bettinger.png","luke_gormsen":"/assets/headshots/luke_gormsen.png","matt_gough":"/assets/headshots/matt_gough.png","matt_schuenemann":"/assets/headshots/matt_schuenemann.png","matthew_nugent":"/assets/headshots/matthew_nugent.png","michael_camilleri":"/assets/headshots/michael_camilleri.png","michael_pilger":"/assets/headshots/michael_pilger.png","nick_hulgrave":"/assets/headshots/nick_hulgrave.png","nick_swiderski":"/assets/headshots/nick_swiderski.png","noah_adkins":"/assets/headshots/noah_adkins.png","noah_cerniglia":"/assets/headshots/noah_cerniglia.png","patrick_collins":"/assets/headshots/patrick_collins.png","peter_dolezal":"/assets/headshots/peter_dolezal.png","quinn_brown":"/assets/headshots/quinn_brown.png","ralph_gonzalez":"/assets/headshots/ralph_gonzalez.png","ryan_mccain":"/assets/headshots/ryan_mccain.png","ryan_soenen":"/assets/headshots/ryan_soenen.png","sam_spolyar":"/assets/headshots/sam_spolyar.png","sebastian_borjas":"/assets/headshots/sebastian_borjas.png","smith_mcgruder":"/assets/headshots/smith_mcgruder.png","stephen_scalfani":"/assets/headshots/stephen_scalfani.png","tad_bates":"/assets/headshots/tad_bates.png","teddy_skendzel":"/assets/headshots/teddy_skendzel.png","tim_baldwin":"/assets/headshots/tim_baldwin.png","tim_gannon":"/assets/headshots/tim_gannon.png","tommy_wollscheid":"/assets/headshots/tommy_wollscheid.png","will_carter":"/assets/headshots/will_carter.png","will_cohn":"/assets/headshots/will_cohn.png","will_stevens":"/assets/headshots/will_stevens.png","zach_zywiec":"/assets/headshots/zach_zywiec.png"};

// Explicit DOM bindings. Do not rely on browser-created globals from element IDs.
const statusEl=document.getElementById("status");
const contentEl=document.getElementById("content");
const headshotEl=document.getElementById("headshot");
const playerNameEl=document.getElementById("playerName");
const playerMetaEl=document.getElementById("playerMeta");
const teamChipsEl=document.getElementById("teamChips");
const summaryEl=document.getElementById("summary");
const batStreaksEl=document.getElementById("batStreaks");
const pitStreaksEl=document.getElementById("pitStreaks");
const milestonesEl=document.getElementById("milestones");
const snapshotEl=document.getElementById("snapshot");
const batTableEl=document.getElementById("batTable");
const pitTableEl=document.getElementById("pitTable");

const n=v=>Number(v||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canonicalTeam=t=>({"Seven Deadly Zyns":"Zyns","South Bend Wifflers":"Zyns","Stiffies":"Stiff Wifflers","Goobers":"Goofy Goobers","Drunken Sluggers":"Twin Titans","Saudi Arabian Yard Goats":"Twin Titans","Yard Goats":"Twin Titans"}[t]||t);
const logoMap={"Silverbacks":"/assets/logos/silverbacks.png?v=81","Storm":"/assets/logos/storm.png?v=81","Zyns":"/assets/logos/zyns.png?v=81","Dirty Dawgs":"/assets/logos/dirty-dawgs.png?v=81","Goofy Goobers":"/assets/logos/goofy-goobers.png?v=81","Midnight":"/assets/logos/midnight.png?v=81","Ball Busters":"/assets/logos/ball-busters.png?v=81","Stiff Wifflers":"/assets/logos/stiff-wifflers.png?v=81","Twin Titans":"/assets/logos/twin-titans.png?v=81","Underdawgs":"/assets/logos/underdawgs.png?v=81"};

function histIpToOuts(v){
 const s=String(v??"").trim();if(!s)return 0;const x=parseFloat(s);if(!Number.isFinite(x))return 0;
 const w=Math.floor(x),f=s.includes(".")?s.split(".")[1].replace(/0+$/,""):"";
 let r=0;if(["1","10","33","3"].includes(f))r=1;else if(["2","20","67","66","7"].includes(f))r=2;
 return w*3+r;
}
function outsToIp(o){o=Math.round(n(o));return `${Math.floor(o/3)}${o%3?`.${o%3}`:""}`}

function careerBat(rows){
 const out={PAs:0,ABs:0,Runs:0,Hits:0,Singles:0,Doubles:0,Triples:0,HRs:0,RBI:0,BB:0,Ks:0,HBP:0,GP:0};
 for(const r of rows)for(const k of Object.keys(out))out[k]+=n(r[k]);
 const tb=out.Singles+2*out.Doubles+3*out.Triples+4*out.HRs;
 out.BA=out.ABs?out.Hits/out.ABs:0;
 out.OBP=out.PAs?(out.Hits+out.BB+out.HBP)/out.PAs:0;
 out.SLG=out.ABs?tb/out.ABs:0;out.OPS=out.OBP+out.SLG;return out;
}
function careerPit(rows){
 const out={GP:0,Apps:0,Starts:0,W:0,L:0,S:0,Outs:0,BF:0,Runs:0,ER:0,Hits:0,Walks:0,Ks:0,HRs:0,HBP:0,WP:0};
 for(const r of rows){
   for(const k of ["GP","Apps","Starts","W","L","S","BF","Runs","ER","Hits","Walks","Ks","HRs","HBP","WP"])out[k]+=n(r[k]);
   out.Outs+=(r.Outs!==undefined?n(r.Outs):histIpToOuts(r.IP));
 }
 const inn=out.Outs/3;
 out.IP=outsToIp(out.Outs);out.ERA=inn?out.ER*3/inn:null;out.WHIP=inn?(out.Walks+out.Hits)/inn:null;return out;
}
function rate(v,d=3){return Number.isFinite(v)?v.toFixed(d).replace(/^0/,""):"—"}
function fmt(v,d=2){return Number.isFinite(Number(v))?Number(v).toFixed(d):"—"}

function bestStreak(rows,test,label){
 let best=0,cur=0;
 for(const r of rows){if(test(r)){cur++;best=Math.max(best,cur)}else cur=0}
 return best>=2?`${best} consecutive series ${label}`:null;
}
function battingStreaks(rows){
 const c=[
   bestStreak(rows,r=>n(r.H)>=3,"with at least 3 H"),
   bestStreak(rows,r=>n(r.H)>=1,"with at least 1 H"),
   bestStreak(rows,r=>n(r.HR)>=1,"with a HR"),
   bestStreak(rows,r=>n(r.RBI)>=2,"with at least 2 RBI")
 ].filter(Boolean);
 return [...new Set(c)].slice(0,2);
}
function pitchingStreaks(rows){
 const c=[
   bestStreak(rows,r=>n(r.K)>=5,"with at least 5 K"),
   bestStreak(rows,r=>n(r.K)>=3,"with at least 3 K"),
   bestStreak(rows,r=>n(r.K)>=1,"with at least 1 K"),
   bestStreak(rows,r=>n(r.ER)===0,"without allowing an ER")
 ].filter(Boolean);
 return [...new Set(c)].slice(0,2);
}
function milestone(current,targets,label){
 const target=targets.find(x=>x>current);
 return target?`${target-current} ${label} away from ${target} ${label}`:null;
}
function milestones(b,p){
 const out=[
   milestone(n(b.Hits),[25,50,75,100,125,150,175,200,225,250,300],"H"),
   milestone(n(b.HRs),[5,10,15,20,25,30,40,50],"HR"),
   milestone(n(p.Ks),[25,50,75,100,125,150,175,200,250],"pitching K"),
   milestone(histIpToOuts(p.IP)/3,[25,50,75,100,125,150],"IP")
 ].filter(Boolean);
 return out.slice(0,3);
}
function putList(el,items,empty){
 el.innerHTML=items.length?items.map(x=>`<li>${esc(x)}</li>`).join(""):`<li class="muted">${esc(empty)}</li>`;
}

function seasonRows(){
 const bat=(ND_DATA.battingSeasons||[]).filter(r=>r.Player_ID===PLAYER_ID).map(r=>({...r}));
 const pit=(ND_DATA.pitchingSeasons||[]).filter(r=>r.Player_ID===PLAYER_ID).map(r=>({...r}));

 const lb=(LIVE?.batting_series||[]);
 if(lb.length){
   const x={Player_ID:PLAYER_ID,Season:"2026",Team:lb[lb.length-1].team_name,GP:0,PAs:0,ABs:0,Runs:0,Hits:0,Singles:0,Doubles:0,Triples:0,HRs:0,RBI:0,BB:0,Ks:0,HBP:0};
   for(const r of lb){x.GP+=n(r.GP);x.PAs+=n(r.PA);x.ABs+=n(r.AB);x.Runs+=n(r.R);x.Hits+=n(r.H);x.Singles+=n(r["1B"]);x.Doubles+=n(r["2B"]);x.Triples+=n(r["3B"]);x.HRs+=n(r.HR);x.RBI+=n(r.RBI);x.BB+=n(r.BB);x.Ks+=n(r.SO);x.HBP+=n(r.HBP)}
   const tb=x.Singles+2*x.Doubles+3*x.Triples+4*x.HRs;x.BA=x.ABs?x.Hits/x.ABs:0;x.OBP=x.PAs?(x.Hits+x.BB+x.HBP)/x.PAs:0;x.SLG=x.ABs?tb/x.ABs:0;x.OPS=x.OBP+x.SLG;bat.push(x);
 }
 const lp=(LIVE?.pitching_series||[]);
 if(lp.length){
   const d=LIVE.decisions||{};
   const x={Player_ID:PLAYER_ID,Season:"2026",Team:lp[lp.length-1].team_name,GP:0,Apps:0,Starts:0,W:n(d.wins),L:n(d.losses),S:n(d.saves),Outs:0,BF:0,Runs:0,ER:0,Hits:0,Walks:0,Ks:0,HRs:0,HBP:0,WP:0};
   for(const r of lp){x.GP+=n(r.GP);x.Apps+=n(r.Apps);x.Starts+=n(r.Starts);x.Outs+=n(r.Outs);x.BF+=n(r.BF);x.Runs+=n(r.R);x.ER+=n(r.ER);x.Hits+=n(r.H);x.Walks+=n(r.BB);x.Ks+=n(r.K);x.HRs+=n(r.HR);x.HBP+=n(r.HBP);x.WP+=n(r.WP)}
   const inn=x.Outs/3;x.IP=outsToIp(x.Outs);x.ERA=inn?x.ER*3/inn:null;x.WHIP=inn?(x.Hits+x.Walks)/inn:null;pit.push(x);
 }
 return {bat,pit};
}

function batTable(rows){
 const cols=[["Season","Year"],["Team","Tm"],["GP","G"],["PAs","PA"],["ABs","AB"],["Runs","R"],["Hits","H"],["Doubles","2B"],["Triples","3B"],["HRs","HR"],["RBI","RBI"],["BB","BB"],["Ks","SO"],["BA","BA"],["OBP","OBP"],["SLG","SLG"],["OPS","OPS"]];
 const body=rows.sort((a,b)=>n(a.Season)-n(b.Season)).map(r=>`<tr>${cols.map(([k])=>`<td>${k==="Team"?esc(canonicalTeam(r[k]||"—")):(["BA","OBP","SLG","OPS"].includes(k)?rate(n(r[k])):esc(r[k]??0))}</td>`).join("")}</tr>`).join("");
 const c=careerBat(rows);
 const career={Season:"Career",Team:"—",...c};
 return `<thead><tr>${cols.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${body}<tr class="career">${cols.map(([k])=>`<td>${k==="Team"?"—":(["BA","OBP","SLG","OPS"].includes(k)?rate(n(career[k])):esc(career[k]??0))}</td>`).join("")}</tr></tbody>`;
}
function pitTable(rows){
 const cols=[["Season","Year"],["Team","Tm"],["GP","G"],["Starts","GS"],["W","W"],["L","L"],["ERA","ERA"],["IP","IP"],["Hits","H"],["Runs","R"],["ER","ER"],["HRs","HR"],["Walks","BB"],["Ks","SO"],["WHIP","WHIP"]];
 const body=rows.sort((a,b)=>n(a.Season)-n(b.Season)).map(r=>`<tr>${cols.map(([k])=>`<td>${k==="Team"?esc(canonicalTeam(r[k]||"—")):(k==="ERA"||k==="WHIP"?fmt(r[k]):esc(r[k]??0))}</td>`).join("")}</tr>`).join("");
 const c=careerPit(rows);
 const career={Season:"Career",Team:"—",...c};
 return `<thead><tr>${cols.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${body}<tr class="career">${cols.map(([k])=>`<td>${k==="Team"?"—":(k==="ERA"||k==="WHIP"?fmt(career[k]):esc(career[k]??0))}</td>`).join("")}</tr></tbody>`;
}

async function init(){
 if(!PLAYER_ID){
   statusEl.textContent="No player selected. Return to the Players page and choose a player.";
   return;
 }

 statusEl.textContent="Loading player…";

 try{
   const liveRes=await fetch(`/api/public/player?id=${encodeURIComponent(PLAYER_ID)}&season=2026`,{cache:"no-store"});
   let live;
   try{
     live=await liveRes.json();
   }catch(parseErr){
     throw new Error(`Player API returned an unreadable response (HTTP ${liveRes.status}).`);
   }

   if(!liveRes.ok||!live.ok){
     const detail=live?.detail?` ${live.detail}`:"";
     throw new Error(`${live?.error||`Player API failed (HTTP ${liveRes.status}).`}${detail}`);
   }

   LIVE=live;

   const staticPlayer=(ND_DATA.players||[]).find(p=>p.Player_ID===PLAYER_ID)||{};
   const {bat,pit}=seasonRows();
   const cb=careerBat(bat),cp=careerPit(pit);

   document.title=`${live.player.name} | ND Wiffle`;
   playerNameEl.textContent=live.player.name;
   playerMetaEl.textContent=`${live.player.class_year?`Class of ${live.player.class_year}`:"Class year unavailable"}${Number(live.player.retired)?" · Retired":" · Active"}`;

   const hu=HEADSHOTS[PLAYER_ID]||"";
   if(hu){
     headshotEl.src=hu;
     headshotEl.alt=`${live.player.name} headshot`;
     headshotEl.onerror=()=>{
       headshotEl.onerror=null;
       headshotEl.src="/assets/league-mark.png";
       headshotEl.alt="ND Wiffle";
     };
   }else{
     headshotEl.src="/assets/league-mark.png";
     headshotEl.alt="ND Wiffle";
   }

   const teams=[...new Set((live.rosters||[]).map(x=>canonicalTeam(x.team_name)).filter(Boolean))];
   teamChipsEl.innerHTML=teams.length
     ?teams.map(t=>`<span class="chip">${logoMap[t]?`<img src="${logoMap[t]}" style="width:15px;height:15px;object-fit:contain;vertical-align:middle;margin-right:4px">`:""}${esc(t)}</span>`).join("")
     :'<span class="chip">Team history unavailable</span>';

   summaryEl.innerHTML=[
     [cb.Hits,"Career H"],[cb.HRs,"Career HR"],[cb.PAs,"Career PA"],
     [cp.Ks,"Pitching K"],[cp.IP,"Career IP"],[cp.ERA===null?"—":fmt(cp.ERA),"Career ERA"]
   ].map(([v,l])=>`<div><strong>${v}</strong><span>${l}</span></div>`).join("");

   putList(batStreaksEl,battingStreaks(live.batting_series||[]),"Not enough 2026 series data for a multi-series batting streak.");
   putList(pitStreaksEl,pitchingStreaks(live.pitching_series||[]),"Not enough 2026 pitching-series data for a multi-series streak.");
   putList(milestonesEl,milestones(cb,cp),"No nearby tracked milestones.");

   const b26=bat.find(x=>String(x.Season)==="2026"),p26=pit.find(x=>String(x.Season)==="2026");
   const snap=[];
   if(b26)snap.push(`${b26.Hits} H, ${b26.HRs} HR, ${rate(n(b26.BA))} AVG in 2026`);
   if(p26)snap.push(`${p26.Ks} K, ${p26.IP} IP, ${fmt(p26.ERA)} ERA in 2026`);
   putList(snapshotEl,snap,"No 2026 stats yet.");

   batTableEl.innerHTML=bat.length?batTable(bat):'<tbody><tr><td class="empty">No batting seasons recorded.</td></tr></tbody>';
   pitTableEl.innerHTML=pit.length?pitTable(pit):'<tbody><tr><td class="empty">No pitching seasons recorded.</td></tr></tbody>';

   statusEl.style.display="none";
   contentEl.style.display="";
 }catch(e){
   console.error("Player page failed:",e);
   statusEl.innerHTML=`<strong style="color:#eb7884">Could not load this player.</strong><br><span style="color:var(--muted)">${esc(e.message||String(e))}</span><br><a href="/players/" style="display:inline-block;margin-top:10px;color:var(--gold);font-weight:900">← Back to Players</a>`;
   contentEl.style.display="none";
 }
}
init();
</script>
</body>
</html>

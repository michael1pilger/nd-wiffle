<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Series Hub | ND Wiffle</title><link rel="stylesheet" href="/assets/styles.css?v=81">
<style>
.hub{padding:32px 0 50px}.hub h1{font-size:42px;margin:5px 0 8px}.hub-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.hub-tab{border:1px solid var(--border);background:#0d1729;color:#fff;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer}.hub-tab.active{background:var(--gold);color:#111;border-color:var(--gold)}.hub-frame{display:none;width:100%;height:1250px;border:1px solid var(--border);border-radius:14px;background:#08111f}.hub-frame.active{display:block}@media(max-width:700px){.hub-frame{height:1550px}}
</style></head><body>
<div class="sitebar"><div class="container nav"><a class="logo" href="/">ND WIFFLE</a><div class="links"><a href="/admin/">Admin Home</a><a class="active" href="/admin/series/">Series Hub</a><a href="/admin/fantasy/">Fantasy Slates</a><a href="/admin/rosters/">Rosters</a><a href="/admin/draft/">Draft</a><a href="/admin/exports/">Export Data</a></div></div></div>
<main class="hub"><div class="container"><div class="eyebrow">Commissioner Tools · BUILD v88</div><h1>Series Hub</h1><p class="muted">Schedule the matchup, assign the umpire, enter/validate stats, then review the published archive without leaving this workflow.</p>
<div class="hub-tabs"><button class="hub-tab active" data-tab="schedule">1 · Schedule</button><button class="hub-tab" data-tab="stats">2 · Stat Entry</button><button class="hub-tab" data-tab="archive">3 · Archive</button></div>
<iframe class="hub-frame active" id="frame-schedule" src="/admin/schedule/"></iframe>
<iframe class="hub-frame" id="frame-stats" src="/admin/series-entry/"></iframe>
<iframe class="hub-frame" id="frame-archive" src="/admin/series-archive/"></iframe>
</div></main><script>
document.querySelectorAll(".hub-tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".hub-tab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".hub-frame").forEach(f=>f.classList.toggle("active",f.id==="frame-"+b.dataset.tab))});
</script></body></html>

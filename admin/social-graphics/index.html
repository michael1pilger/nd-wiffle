<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Graphic Builder | ND Wiffle</title>
<link rel="stylesheet" href="/assets/styles.css?v=81">
<style>
*{box-sizing:border-box}
body{background:#05080d;color:#fff}
.builder{padding:22px 0 52px}
.builder-shell{max-width:1500px;margin:0 auto;padding:0 18px}
.builder-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:13px}
.builder-head h1{margin:3px 0 0;font-size:27px}.builder-head p{margin:3px 0 0;color:var(--muted);font-size:10px}
.control-card{position:relative;border:1px solid #292d33;border-radius:13px;background:#080808;padding:14px 59px 12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.22)}
.primary-row{display:grid;grid-template-columns:1.05fr 1.05fr 1fr;gap:10px;margin-bottom:10px}
.icon-row,.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.icon-row{margin-bottom:8px}
.ctrl{min-width:0}.ctrl label{display:block;text-align:center;color:#fff;font:900 11px/1.1 Georgia,serif;margin:0 0 5px}
.ctrl input,.ctrl select{width:100%;height:31px;border:1px solid #34383e;border-radius:8px;background:#202020;color:#fff;padding:4px 8px;font:900 10px/1.1 Arial,sans-serif;outline:none}
.ctrl input:focus,.ctrl select:focus{border-color:#6da7a6;box-shadow:0 0 0 2px rgba(109,167,166,.12)}
.icon-ctrl{position:relative;text-align:center}.icon-ctrl>label{margin-bottom:5px}
.icon-pick{width:39px;height:39px;margin:0 auto;border:0;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;cursor:pointer;padding:5px;transition:transform .12s ease}.icon-pick:hover{transform:scale(1.05)}.icon-pick svg{width:30px;height:30px;display:block}
.icon-menu{display:none;position:absolute;left:50%;top:55px;transform:translateX(-50%);z-index:20;width:218px;padding:8px;border:1px solid #34383e;border-radius:10px;background:#121212;box-shadow:0 18px 42px rgba(0,0,0,.45)}.icon-menu.open{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.icon-option{border:1px solid #333;border-radius:8px;background:#1d1d1d;color:#fff;padding:6px 4px;cursor:pointer;font-size:7px;font-weight:800}.icon-option:hover{border-color:#6da7a6}.icon-option svg{display:block;width:27px;height:27px;margin:0 auto 4px;color:#fff}
.action-stack{position:absolute;right:13px;top:57px;display:flex;flex-direction:column;gap:9px}.action-btn{width:35px;height:35px;border:0;border-radius:10px;background:#4d9998;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;cursor:pointer}.action-btn:hover{filter:brightness(1.1)}
.custom-colors{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}.custom-colors.show{display:grid}.color-mini{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}.color-mini input[type=color]{width:30px;height:27px;padding:2px;border-radius:6px}.color-mini span{font-size:8px;color:#bfc6cf;font-weight:800}
.preview-block{margin-top:14px}.preview-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;color:#8792a0;font-size:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:900}
.preview-wrap{display:flex;justify-content:center;align-items:flex-start;padding:7px 0}.preview-frame{width:min(100%,760px);aspect-ratio:1/1;border:1px solid #272c33;background:#111;box-shadow:0 18px 55px rgba(0,0,0,.35)}
#graphic{display:block;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#111b27;border:1px solid #33465d;color:#fff;border-radius:9px;padding:8px 12px;font-size:10px;font-weight:800;transition:.18s ease;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.control-card{padding-right:14px}.action-stack{position:static;flex-direction:row;justify-content:flex-end;margin-top:10px}.primary-row{grid-template-columns:1fr}.icon-row,.stat-row{grid-template-columns:1fr 1fr}.builder-head{display:block}.builder-head .muted{margin-top:5px}.icon-menu{top:55px}}
@media(max-width:520px){.icon-row,.stat-row{grid-template-columns:1fr}.custom-colors{grid-template-columns:1fr}.preview-frame{width:100%}}
</style>
</head>
<body>
<div class="sitebar"><div class="container nav"><a class="logo" href="/">ND WIFFLE</a><div class="links"><a href="/admin/">Admin Home</a><a href="/admin/series/">Series Hub</a><a class="active" href="/admin/social-graphics/">Graphics</a><a href="/admin/exports/">Export Data</a></div></div></div>

<main class="builder"><div class="builder-shell">
  <div class="builder-head">
    <div><div class="eyebrow">Commissioner Tools · BUILD v105</div><h1>Player Graphic Builder</h1><p>Fixed stat-card layout. Change only the player, team, icons, and four stat lines.</p></div>
    <div class="muted" id="saveState">Changes save automatically in this browser.</div>
  </div>

  <section class="control-card" aria-label="Graphic controls">
    <div class="primary-row">
      <div class="ctrl"><label for="team">Team</label><select id="team"></select></div>
      <div class="ctrl"><label for="playerName">Name</label><input id="playerName" type="text" value="SHARKEY" autocomplete="off"></div>
      <div class="ctrl"><label for="number">Number</label><input id="number" type="text" value="17" inputmode="numeric" autocomplete="off"></div>
    </div>

    <div class="custom-colors" id="customColors">
      <label class="color-mini"><input id="primaryColor" type="color" value="#1b2948"><span>Primary</span></label>
      <label class="color-mini"><input id="accentColor" type="color" value="#f1c652"><span>Accent</span></label>
      <label class="color-mini"><input id="backgroundColor" type="color" value="#e5d8c7"><span>Background</span></label>
    </div>

    <div class="icon-row" id="iconRow"></div>
    <div class="stat-row">
      <div class="ctrl"><input id="stat1" aria-label="Stat 1" type="text" value="6/6 H/AB" autocomplete="off"></div>
      <div class="ctrl"><input id="stat2" aria-label="Stat 2" type="text" value="3 HOME RUNS" autocomplete="off"></div>
      <div class="ctrl"><input id="stat3" aria-label="Stat 3" type="text" value="10 RBIs" autocomplete="off"></div>
      <div class="ctrl"><input id="stat4" aria-label="Stat 4" type="text" value="2 STOLEN BASES" autocomplete="off"></div>
    </div>

    <div class="action-stack">
      <button class="action-btn" id="downloadBtn" title="Download PNG" aria-label="Download PNG">⇩</button>
      <button class="action-btn" id="resetBtn" title="Reset graphic" aria-label="Reset graphic">↶</button>
    </div>
  </section>

  <section class="preview-block">
    <div class="preview-top"><span>Live preview</span><span>1080 × 1080 PNG</span></div>
    <div class="preview-wrap"><div class="preview-frame"><svg id="graphic" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Player stat graphic"></svg></div></div>
  </section>
</div></main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ICONS={
  batball:`<path d="M18 82 63 29c5-6 14-7 19-1 5 5 4 14-2 19L29 89c-5 4-15-2-11-7z"/><path d="M19 76 31 88M24 69l13 13M30 63l13 12" fill="none"/><circle cx="72" cy="72" r="15"/><path d="M65 60c5 4 6 8 4 13s-1 9 4 13M79 61c-4 4-5 8-3 12s1 8-3 13" fill="none"/>`,
  field:`<path d="M15 60 50 28l35 32-35 31z"/><path d="M28 59 50 43l22 16-22 19zM50 43v35M28 59h44" fill="none"/><path d="M60 18 48 67" fill="none" stroke-width="6"/><circle cx="63" cy="18" r="7"/>`,
  shoe:`<path d="M13 66c14 2 25-1 37-13l8-18 13 4 3 16c2 10 8 16 17 22 4 3 2 10-4 11H31c-12 0-18-6-18-15z"/><path d="M56 47l16 4M53 55l19 4M49 63l19 4M12 78H3M18 86H7" fill="none"/>`,
  plate:`<path d="M14 18h72v42L50 91 14 60z"/><path d="M24 28h52v26L50 77 24 54z" fill="none"/>`,
  baseball:`<circle cx="50" cy="50" r="43"/><path d="M28 15c7 8 10 18 9 29s-5 22-13 31M72 15c-7 8-10 18-9 29s5 22 13 31" fill="none"/><path d="m31 28 8 3m-10 8 8 2m-9 10 8 0m33-23-8 3m10 8-8 2m9 10-8 0" fill="none"/>`,
  wiffle:`<circle cx="50" cy="50" r="43"/><g fill="currentColor" stroke="none"><ellipse cx="35" cy="26" rx="5" ry="10"/><ellipse cx="50" cy="22" rx="5" ry="10"/><ellipse cx="64" cy="27" rx="5" ry="10"/><ellipse cx="27" cy="39" rx="5" ry="10" transform="rotate(-22 27 39)"/><ellipse cx="73" cy="39" rx="5" ry="10" transform="rotate(22 73 39)"/></g>`,
  trophy:`<path d="M30 12h40v18c0 18-8 29-20 34-12-5-20-16-20-34z"/><path d="M30 20H15c0 18 8 27 22 28M70 20h15c0 18-8 27-22 28M50 64v13M35 87h30M40 77h20" fill="none"/>`
};
const ICON_LABELS={batball:"Bat + ball",field:"Field / HR",shoe:"Running shoe",plate:"Home plate",baseball:"Baseball",wiffle:"Wiffle ball",trophy:"Trophy"};

// Team palettes are sampled/curated from the logo files in /assets/logos.
const THEMES={
  reference:{name:"Reference (navy / gold)",primary:"#1b2948",accent:"#f1c652",background:"#e5d8c7"},
  "ball-busters":{name:"Ball Busters",primary:"#08112a",accent:"#942624",background:"#ead8d8"},
  "dirty-dawgs":{name:"Dirty Dawgs",primary:"#320d11",accent:"#c69841",background:"#e8deca"},
  "goofy-goobers":{name:"Goofy Goobers",primary:"#05060a",accent:"#db5b29",background:"#f0d8cf"},
  midnight:{name:"Midnight",primary:"#212223",accent:"#9ca5aa",background:"#e2e5e7"},
  silverbacks:{name:"Silverbacks",primary:"#010101",accent:"#caad63",background:"#e8dec6"},
  "stiff-wifflers":{name:"Stiff Wifflers",primary:"#14264b",accent:"#2c5b3f",background:"#dce7e0"},
  storm:{name:"Storm",primary:"#5e0a9c",accent:"#9c7717",background:"#e8dfc8"},
  "twin-titans":{name:"Twin Titans",primary:"#464e60",accent:"#912826",background:"#e8d9da"},
  underdawgs:{name:"Underdawgs",primary:"#3b2462",accent:"#888789",background:"#e2e1e4"},
  zyns:{name:"Zyns",primary:"#041826",accent:"#94ecee",background:"#ddf5f5"},
  custom:{name:"Custom colors…",primary:"#1b2948",accent:"#f1c652",background:"#e5d8c7"}
};

const DEFAULT={team:"reference",name:"SHARKEY",number:"17",icons:["batball","field","shoe","plate"],stats:["6/6 H/AB","3 HOME RUNS","10 RBIs","2 STOLEN BASES"],custom:{primary:"#1b2948",accent:"#f1c652",background:"#e5d8c7"}};
let state=structuredClone(DEFAULT);

function theme(){return state.team==="custom"?state.custom:THEMES[state.team]||THEMES.reference}
function iconSVG(key,color="#111",size=30){return `<svg viewBox="0 0 100 100" aria-hidden="true" style="color:${color}" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.baseball}</svg>`}
function splitStat(raw){const s=String(raw||"").trim(); if(!s)return ["",""]; const m=s.match(/^(\S+)(?:\s+(.*))?$/); return [m?.[1]||s,m?.[2]||""]}

function buildTeamOptions(){
  const sel=$("#team");
  sel.innerHTML=Object.entries(THEMES).map(([id,t])=>`<option value="${id}">${esc(t.name.toUpperCase())}</option>`).join("");
  sel.value=state.team;
}

function buildIconControls(){
  const row=$("#iconRow");
  row.innerHTML=state.icons.map((key,i)=>`<div class="icon-ctrl" data-icon-index="${i}"><label>Icon ${i+1}</label><button type="button" class="icon-pick" data-open-icon="${i}" aria-label="Choose icon ${i+1}">${iconSVG(key,"#111")}</button><div class="icon-menu" id="iconMenu${i}">${Object.keys(ICONS).map(k=>`<button type="button" class="icon-option" data-set-icon="${k}" data-index="${i}">${iconSVG(k,"#fff")}<span>${esc(ICON_LABELS[k])}</span></button>`).join("")}</div></div>`).join("");
  row.querySelectorAll("[data-open-icon]").forEach(btn=>btn.onclick=e=>{e.stopPropagation();const idx=btn.dataset.openIcon;document.querySelectorAll(".icon-menu").forEach(m=>m.classList.toggle("open",m.id===`iconMenu${idx}`&&!m.classList.contains("open")));});
  row.querySelectorAll("[data-set-icon]").forEach(btn=>btn.onclick=e=>{e.stopPropagation();state.icons[+btn.dataset.index]=btn.dataset.setIcon;save();buildIconControls();render();});
}

function jerseyPath(){
  // Wide-shouldered jersey silhouette matched to the supplied reference image.
  return `M 146 145
    C 172 118 206 100 248 83
    L 389 26
    C 414 15 434 15 458 21
    C 510 32 569 34 625 27
    C 646 24 660 16 677 18
    C 697 23 714 35 735 45
    L 867 101
    C 906 117 936 136 951 160
    L 1077 377
    L 1077 589
    L 896 698
    L 896 1080
    L 187 1080
    L 187 697
    L 6 589
    L 6 378
    L 126 181
    C 132 165 139 153 146 145 Z`;
}

function render(){
  const t=theme(), panel="#f5f1eb";
  const [s1,s2,s3,s4]=state.stats.map(splitStat);
  const stats=[s1,s2,s3,s4];
  const cx=[140,400,670,940];
  const iconSize=[145,145,150,140];
  const iconY=[780,779,777,782];
  const name=String(state.name||"").toUpperCase();
  const num=String(state.number||"");
  const svg=$("#graphic");
  svg.innerHTML=`
    <rect width="1080" height="1080" fill="${t.background}"/>
    <path d="${jerseyPath()}" fill="${panel}"/>

    <text x="540" y="240" fill="${t.primary}" stroke="${t.accent}" stroke-width="6" paint-order="stroke fill" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif" font-size="112" font-weight="900" letter-spacing="3">${esc(name)}</text>
    <text x="540" y="655" fill="${t.primary}" stroke="${t.accent}" stroke-width="8" paint-order="stroke fill" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif" font-size="390" font-weight="900" letter-spacing="-4">${esc(num)}</text>

    ${cx.map((x,i)=>`<circle cx="${x}" cy="850" r="103" fill="${panel}" stroke="${t.accent}" stroke-width="5"/>`).join("")}
    ${cx.map((x,i)=>`<g transform="translate(${x-iconSize[i]/2} ${iconY[i]}) scale(${iconSize[i]/100})" style="color:${t.accent}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${ICONS[state.icons[i]]||ICONS.baseball}</g>`).join("")}

    ${stats.map(([value,label],i)=>`<text x="${cx[i]}" y="985" fill="${t.accent}" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif" font-size="29" font-weight="800">${esc(value)}</text><text x="${cx[i]}" y="1017" fill="${t.accent}" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif" font-size="24" font-weight="800">${esc(String(label).toUpperCase())}</text>`).join("")}
  `;
  $("#customColors").classList.toggle("show",state.team==="custom");
  $("#team").value=state.team;
  $("#playerName").value=state.name;
  $("#number").value=state.number;
  state.stats.forEach((v,i)=>$("#stat"+(i+1)).value=v);
  $("#primaryColor").value=state.custom.primary;$("#accentColor").value=state.custom.accent;$("#backgroundColor").value=state.custom.background;
}

function save(){try{localStorage.setItem("ndwiffle_simple_graphic_v105",JSON.stringify(state));$("#saveState").textContent="Saved automatically in this browser."}catch{}}
function load(){try{const s=JSON.parse(localStorage.getItem("ndwiffle_simple_graphic_v105")||"null");if(s&&s.icons&&s.stats)state={...structuredClone(DEFAULT),...s,custom:{...DEFAULT.custom,...(s.custom||{})}}}catch{}}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1700)}

function bind(){
  $("#team").onchange=e=>{state.team=e.target.value;save();render()};
  $("#playerName").oninput=e=>{state.name=e.target.value;save();render()};
  $("#number").oninput=e=>{state.number=e.target.value;save();render()};
  for(let i=0;i<4;i++)$("#stat"+(i+1)).oninput=e=>{state.stats[i]=e.target.value;save();render()};
  [["primaryColor","primary"],["accentColor","accent"],["backgroundColor","background"]].forEach(([id,key])=>$("#"+id).oninput=e=>{state.custom[key]=e.target.value;save();render()});
  $("#resetBtn").onclick=()=>{state=structuredClone(DEFAULT);save();buildTeamOptions();buildIconControls();render();toast("Graphic reset")};
  $("#downloadBtn").onclick=downloadPNG;
  document.addEventListener("click",()=>document.querySelectorAll(".icon-menu").forEach(m=>m.classList.remove("open")));
}

async function downloadPNG(){
  const svg=$("#graphic");
  const clone=svg.cloneNode(true); clone.setAttribute("width","1080");clone.setAttribute("height","1080");clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const data=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([data],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob), img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=1080;c.height=1080;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,1080,1080);URL.revokeObjectURL(url);c.toBlob(png=>{const a=document.createElement("a");const safe=(state.name||"player").trim().replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"player";a.href=URL.createObjectURL(png);a.download=`${safe}-stat-graphic.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("PNG downloaded")},"image/png")};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Could not export PNG")};
  img.src=url;
}

load();buildTeamOptions();buildIconControls();bind();render();
</script>
</body>
</html>

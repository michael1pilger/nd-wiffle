<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Graphic Builder | ND Wiffle</title>
<link rel="stylesheet" href="/assets/styles.css?v=81">
<style>
@import url('https://fonts.cdnfonts.com/css/jersey-m54');
*{box-sizing:border-box}
:root{--jersey-font:'Jersey M54','Arial Black',Impact,Haettenschweiler,sans-serif;}
body{background:#05080d;color:#fff}
.builder{padding:22px 0 52px}
.builder-shell{max-width:1500px;margin:0 auto;padding:0 18px}
.builder-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:13px}
.builder-head h1{margin:3px 0 0;font-size:27px}.builder-head p{margin:3px 0 0;color:var(--muted);font-size:10px}
.control-card{position:relative;border:1px solid #292d33;border-radius:13px;background:#080808;padding:14px 59px 12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.22)}
.primary-row{display:grid;grid-template-columns:1.05fr 1.05fr 1fr;gap:10px;margin-bottom:10px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ctrl{min-width:0}.ctrl label{display:block;text-align:center;color:#fff;font:900 11px/1.1 Georgia,serif;margin:0 0 5px}
.ctrl input,.ctrl select{width:100%;height:31px;border:1px solid #34383e;border-radius:8px;background:#202020;color:#fff;padding:4px 8px;font:900 10px/1.1 Arial,sans-serif;outline:none}
.ctrl input:focus,.ctrl select:focus{border-color:#6da7a6;box-shadow:0 0 0 2px rgba(109,167,166,.12)}
.action-stack{position:absolute;right:13px;top:57px;display:flex;flex-direction:column;gap:9px}.action-btn{width:35px;height:35px;border:0;border-radius:10px;background:#4d9998;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;cursor:pointer}.action-btn:hover{filter:brightness(1.1)}
.custom-colors{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}.custom-colors.show{display:grid}.color-mini{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}.color-mini input[type=color]{width:30px;height:27px;padding:2px;border-radius:6px}.color-mini span{font-size:8px;color:#bfc6cf;font-weight:800}
.preview-block{margin-top:14px}.preview-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;color:#8792a0;font-size:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:900}
.preview-wrap{display:flex;justify-content:center;align-items:flex-start;padding:7px 0}.preview-frame{width:min(100%,760px);aspect-ratio:1/1;border:1px solid #272c33;background:#111;box-shadow:0 18px 55px rgba(0,0,0,.35)}
#graphic{display:block;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#111b27;border:1px solid #33465d;color:#fff;border-radius:9px;padding:8px 12px;font-size:10px;font-weight:800;transition:.18s ease;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.control-card{padding-right:14px}.action-stack{position:static;flex-direction:row;justify-content:flex-end;margin-top:10px}.primary-row{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr}.builder-head{display:block}.builder-head .muted{margin-top:5px}}
@media(max-width:520px){.custom-colors{grid-template-columns:1fr}.preview-frame{width:100%}}
</style>
</head>
<body>
<div class="sitebar"><div class="container nav"><a class="logo" href="/">ND WIFFLE</a><div class="links"><a href="/admin/">Admin Home</a><a href="/admin/series/">Series Hub</a><a class="active" href="/admin/social-graphics/">Graphics</a><a href="/admin/stat-lists/">Stat Lists</a><a href="/admin/exports/">Export Data</a></div></div></div>

<main class="builder"><div class="builder-shell">
  <div class="builder-head">
    <div><div class="eyebrow">Commissioner Tools · BUILD v113</div><h1>Player Graphic Builder</h1><p>Refined stat-card layout with export-safe Jersey M54 rendering.</p></div>
    <div style="display:flex;align-items:center;gap:9px"><a href="/admin/stat-lists/" style="border:1px solid #2d4057;border-radius:8px;padding:7px 10px;color:#fff;text-decoration:none;font-size:9px;font-weight:900;background:#0b1626">Stat Lists Copy Center</a><div class="muted" id="saveState">Changes save automatically in this browser.</div></div>
  </div>

  <section class="control-card" aria-label="Graphic controls">
    <div class="primary-row">
      <div class="ctrl"><label for="team">Team</label><select id="team"></select></div>
      <div class="ctrl"><label for="playerName">Name</label><input id="playerName" type="text" value="SHARKEY" autocomplete="off"></div>
      <div class="ctrl"><label for="number">Number</label><input id="number" type="text" value="17" inputmode="numeric" autocomplete="off"></div>
    </div>

    <div class="custom-colors" id="customColors">
      <label class="color-mini"><input id="primaryColor" type="color" value="#5f31a6"><span>Jersey</span></label>
      <label class="color-mini"><input id="accentColor" type="color" value="#ffffff"><span>Letters</span></label>
      <label class="color-mini"><input id="backgroundColor" type="color" value="#f0c419"><span>Outline</span></label>
    </div>

    <div class="stat-row">
      <div class="ctrl"><label for="stat1">Stat 1</label><input id="stat1" aria-label="Stat 1" type="text" value="6/6 H/AB" autocomplete="off"></div>
      <div class="ctrl"><label for="stat2">Stat 2</label><input id="stat2" aria-label="Stat 2" type="text" value="3 HOME RUNS" autocomplete="off"></div>
      <div class="ctrl"><label for="stat3">Stat 3</label><input id="stat3" aria-label="Stat 3" type="text" value="10 RBIs" autocomplete="off"></div>
    </div>

    <div class="action-stack">
      <button class="action-btn" id="downloadBtn" title="Download PNG" aria-label="Download PNG">⇩</button>
      <button class="action-btn" id="resetBtn" title="Reset graphic" aria-label="Reset graphic">↶</button>
    </div>
  </section>

  <section class="preview-block">
    <div class="preview-top"><span>Live preview</span><span>1080 × 1080 PNG</span></div>
    <div class="preview-wrap"><div class="preview-frame"><svg id="graphic" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Player stat graphic"></svg></div></div>
  </section>
</div></main>
<div class="toast" id="toast"></div>

const DEFAULT={team:"storm",name:"SHARKEY",number:"17",stats:["6/6 H/AB","3 HOME RUNS","10 RBIs"],custom:{primary:"#5f31a6",accent:"#ffffff",background:"#f1c232"}};
let state=structuredClone(DEFAULT);

function theme(){
  if(state.team==="custom"){
    return {name:"Custom colors…",teamLabel:"TEAM NAME",jersey:state.custom.primary,textFill:state.custom.accent,textStroke:state.custom.background,boxValue:state.custom.primary,boxLabel:state.custom.background,boxStroke:state.custom.background,iconBg:state.custom.primary,iconColor:state.custom.accent};
  }
  return THEMES[state.team]||THEMES.storm;
}
function teamLabel(){return (theme().teamLabel||"TEAM").toUpperCase()}
function splitStat(raw){
  const s=String(raw||"").trim();
  if(!s)return ["",""];
  const parts=s.split(/\s+/);
  return parts.length===1?[parts[0],""]:[parts[0],parts.slice(1).join(" ")];
}
function buildTeamOptions(){
  const order=["storm","zyns","goofy-goobers","ball-busters","stiff-wifflers","underdawgs","silverbacks","dirty-dawgs","twin-titans","midnight","custom"];
  const sel=$("#team");
  sel.innerHTML=order.map(id=>`<option value="${id}">${esc(THEMES[id].name.toUpperCase())}</option>`).join("");
  sel.value=state.team;
}

function iconMarkup(i,cx,cy,size,bg,fg){
  const r=size/2;
  const img=size*0.64;
  const x=cx-img/2, y=cy-img/2;
  return `<g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${bg}" stroke="#ffffff" stroke-width="3"/>
    <defs><mask id="iconmask${i}"><image href="${ICONS[i]}" x="${x}" y="${y}" width="${img}" height="${img}" preserveAspectRatio="xMidYMid meet"/></mask></defs>
    <rect x="${x}" y="${y}" width="${img}" height="${img}" fill="${fg}" mask="url(#iconmask${i})"/>
  </g>`;
}
function statCard(i,x,y,w,h,value,label,t){
  const cx=x+w/2;
  const badgeY=y-20;
  return `<g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#ffffff" stroke="${t.boxStroke}" stroke-width="5"/>
    <rect x="${x+14}" y="${y+14}" width="16" height="16" rx="4" fill="${t.boxStroke}" opacity=".85"/>
    <rect x="${x+w-30}" y="${y+14}" width="16" height="16" rx="4" fill="${t.boxStroke}" opacity=".18"/>
    <line x1="${x+22}" y1="${y+46}" x2="${x+w-22}" y2="${y+46}" stroke="${t.boxStroke}" stroke-width="2" opacity=".35"/>
    ${iconMarkup(i,cx,badgeY,72,t.iconBg,t.iconColor)}
    <text x="${cx}" y="${y+94}" fill="${t.boxValue}" text-anchor="middle" font-family="var(--jersey-font)" font-size="40" letter-spacing="1">${esc(value||"")}</text>
    <text x="${cx}" y="${y+131}" fill="${t.boxLabel}" text-anchor="middle" font-family="var(--jersey-font)" font-size="23" letter-spacing="1.2">${esc(String(label||"").toUpperCase())}</text>
  </g>`;
}
function render(){
  const t=theme();
  const stats=state.stats.map(splitStat);
  const w=236,h=164,y=804;
  const boxCenters=[282,540,798];
  const xs=boxCenters.map(c=>c-w/2);
  const name=String(state.name||"").toUpperCase();
  const num=String(state.number||"");
  const team=teamLabel();
  const svg=$("#graphic");
  svg.innerHTML=`
    <rect width="1080" height="1080" fill="#ffffff"/>
    <path d="${jerseyPath()}" fill="${t.jersey}" stroke="#000" stroke-width="4"/>

    <text x="540" y="236" fill="${t.textFill}" stroke="${t.textStroke}" stroke-width="9" paint-order="stroke fill" text-anchor="middle" font-family="var(--jersey-font)" font-size="112" letter-spacing="1.3">${esc(name)}</text>
    <text x="540" y="638" fill="${t.textFill}" stroke="${t.textStroke}" stroke-width="8" paint-order="stroke fill" text-anchor="middle" font-family="var(--jersey-font)" font-size="382" letter-spacing="-1">${esc(num)}</text>
    <text x="540" y="739" fill="${t.textFill}" stroke="${t.textStroke}" stroke-width="3" paint-order="stroke fill" text-anchor="middle" font-family="var(--jersey-font)" font-size="54" letter-spacing="2">${esc(team)}</text>

    ${statCard(0,xs[0],y,w,h,stats[0][0],stats[0][1],t)}
    ${statCard(1,xs[1],y,w,h,stats[1][0],stats[1][1],t)}
    ${statCard(2,xs[2],y,w,h,stats[2][0],stats[2][1],t)}
  `;
  $("#customColors").classList.toggle("show",state.team==="custom");
  $("#team").value=state.team; $("#playerName").value=state.name; $("#number").value=state.number;
  state.stats.forEach((v,i)=>$("#stat"+(i+1)).value=v);
  $("#primaryColor").value=state.custom.primary; $("#accentColor").value=state.custom.accent; $("#backgroundColor").value=state.custom.background;
}
function save(){try{localStorage.setItem("ndwiffle_simple_graphic_v111",JSON.stringify(state)); $("#saveState").textContent="Saved automatically in this browser.";}catch{}}
function load(){
  try{
    const raw=localStorage.getItem("ndwiffle_simple_graphic_v111")||localStorage.getItem("ndwiffle_simple_graphic_v110")||localStorage.getItem("ndwiffle_simple_graphic_v109")||localStorage.getItem("ndwiffle_simple_graphic_v108")||localStorage.getItem("ndwiffle_simple_graphic_v107")||localStorage.getItem("ndwiffle_simple_graphic_v106")||localStorage.getItem("ndwiffle_simple_graphic_v105")||"null";
    const s=JSON.parse(raw);
    if(s){
      const stats=Array.isArray(s.stats)?s.stats.slice(0,3):DEFAULT.stats;
      while(stats.length<3)stats.push(DEFAULT.stats[stats.length]);
      state={...structuredClone(DEFAULT),...s,stats,custom:{...DEFAULT.custom,...(s.custom||{})}};
    }
  }catch{}
}
function toast(msg){const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1700)}
function bind(){
  $("#team").onchange=e=>{state.team=e.target.value; save(); render();};
  $("#playerName").oninput=e=>{state.name=e.target.value; save(); render();};
  $("#number").oninput=e=>{state.number=e.target.value; save(); render();};
  for(let i=0;i<3;i++) $("#stat"+(i+1)).oninput=e=>{state.stats[i]=e.target.value; save(); render();};
  [["primaryColor","primary"],["accentColor","accent"],["backgroundColor","background"]].forEach(([id,key])=>$("#"+id).oninput=e=>{state.custom[key]=e.target.value; save(); render();});
  $("#resetBtn").onclick=()=>{state=structuredClone(DEFAULT); save(); buildTeamOptions(); render(); toast("Graphic reset");};
  $("#downloadBtn").onclick=downloadPNG;
}
function roundedRectPath(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function drawCenteredText(ctx,text,x,y,size,fill,stroke=null,strokeWidth=0,spacing=0){
  text=String(text??"");
  ctx.save();
  ctx.font=`${size}px "Jersey M54", "Arial Black", Impact, sans-serif`;
  ctx.textBaseline="alphabetic";
  ctx.lineJoin="miter";
  ctx.miterLimit=2;
  if(!spacing){
    ctx.textAlign="center";
    if(stroke&&strokeWidth){ctx.strokeStyle=stroke;ctx.lineWidth=strokeWidth;ctx.strokeText(text,x,y);}
    ctx.fillStyle=fill;ctx.fillText(text,x,y);
    ctx.restore();return;
  }
  ctx.textAlign="left";
  const widths=[...text].map(ch=>ctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+Math.max(0,text.length-1)*spacing;
  let px=x-total/2;
  [...text].forEach((ch,i)=>{
    if(stroke&&strokeWidth){ctx.strokeStyle=stroke;ctx.lineWidth=strokeWidth;ctx.strokeText(ch,px,y);}
    ctx.fillStyle=fill;ctx.fillText(ch,px,y);
    px+=widths[i]+spacing;
  });
  ctx.restore();
}
async function loadIconImage(src){
  return await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});
}
function drawTintedIcon(ctx,img,cx,cy,size,bg,fg){
  const r=size/2;

  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  const d=size*.64,x=cx-d/2,y=cy-d/2;
  const off=document.createElement("canvas");off.width=Math.ceil(d);off.height=Math.ceil(d);
  const oc=off.getContext("2d");
  oc.drawImage(img,0,0,off.width,off.height);
  oc.globalCompositeOperation="source-in";oc.fillStyle=fg;oc.fillRect(0,0,off.width,off.height);
  ctx.drawImage(off,x,y,d,d);

async function downloadPNG(){

    // <img> loses the page font context, so export is drawn directly on canvas instead.

    ctx.fillStyle=t.jersey;ctx.fill(jp);ctx.strokeStyle="#000";ctx.lineWidth=4;ctx.stroke(jp);

    });

    c.toBlob(png=>{
      if(!png){toast("Could not export PNG");return;}

      a.href=URL.createObjectURL(png);a.download=`${safe}-stat-graphic.png`;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("PNG downloaded");

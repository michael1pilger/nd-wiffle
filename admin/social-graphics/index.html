<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Graphic Builder | ND Wiffle</title>
<link rel="stylesheet" href="/assets/styles.css?v=81">
<style>
*{box-sizing:border-box}
body{background:#05080d;color:#fff}
.builder{padding:22px 0 52px}
.builder-shell{max-width:1500px;margin:0 auto;padding:0 18px}
.builder-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:13px}
.builder-head h1{margin:3px 0 0;font-size:27px}.builder-head p{margin:3px 0 0;color:var(--muted);font-size:10px}
.control-card{position:relative;border:1px solid #292d33;border-radius:13px;background:#080808;padding:14px 59px 12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.22)}
.primary-row{display:grid;grid-template-columns:1.05fr 1.05fr 1fr;gap:10px;margin-bottom:10px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ctrl{min-width:0}.ctrl label{display:block;text-align:center;color:#fff;font:900 11px/1.1 Georgia,serif;margin:0 0 5px}
.ctrl input,.ctrl select{width:100%;height:31px;border:1px solid #34383e;border-radius:8px;background:#202020;color:#fff;padding:4px 8px;font:900 10px/1.1 Arial,sans-serif;outline:none}
.ctrl input:focus,.ctrl select:focus{border-color:#6da7a6;box-shadow:0 0 0 2px rgba(109,167,166,.12)}
.action-stack{position:absolute;right:13px;top:57px;display:flex;flex-direction:column;gap:9px}.action-btn{width:35px;height:35px;border:0;border-radius:10px;background:#4d9998;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;cursor:pointer}.action-btn:hover{filter:brightness(1.1)}
.custom-colors{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}.custom-colors.show{display:grid}.color-mini{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}.color-mini input[type=color]{width:30px;height:27px;padding:2px;border-radius:6px}.color-mini span{font-size:8px;color:#bfc6cf;font-weight:800}
.preview-block{margin-top:14px}.preview-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;color:#8792a0;font-size:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:900}
.preview-wrap{display:flex;justify-content:center;align-items:flex-start;padding:7px 0}.preview-frame{width:min(100%,760px);aspect-ratio:1/1;border:1px solid #272c33;background:#111;box-shadow:0 18px 55px rgba(0,0,0,.35)}
#graphic{display:block;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#111b27;border:1px solid #33465d;color:#fff;border-radius:9px;padding:8px 12px;font-size:10px;font-weight:800;transition:.18s ease;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.control-card{padding-right:14px}.action-stack{position:static;flex-direction:row;justify-content:flex-end;margin-top:10px}.primary-row{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr}.builder-head{display:block}.builder-head .muted{margin-top:5px}}
@media(max-width:520px){.custom-colors{grid-template-columns:1fr}.preview-frame{width:100%}}
</style>
</head>
<body>
<div class="sitebar"><div class="container nav"><a class="logo" href="/">ND WIFFLE</a><div class="links"><a href="/admin/">Admin Home</a><a href="/admin/series/">Series Hub</a><a class="active" href="/admin/social-graphics/">Graphics</a><a href="/admin/exports/">Export Data</a></div></div></div>

<main class="builder"><div class="builder-shell">
  <div class="builder-head">
    <div><div class="eyebrow">Commissioner Tools · BUILD v108</div><h1>Player Graphic Builder</h1><p>Polished fixed stat-card layout. Change the team, player, number, and three stat lines.</p></div>
    <div class="muted" id="saveState">Changes save automatically in this browser.</div>
  </div>

  <section class="control-card" aria-label="Graphic controls">
    <div class="primary-row">
      <div class="ctrl"><label for="team">Team</label><select id="team"></select></div>
      <div class="ctrl"><label for="playerName">Name</label><input id="playerName" type="text" value="SHARKEY" autocomplete="off"></div>
      <div class="ctrl"><label for="number">Number</label><input id="number" type="text" value="17" inputmode="numeric" autocomplete="off"></div>
    </div>

    <div class="custom-colors" id="customColors">
      <label class="color-mini"><input id="primaryColor" type="color" value="#19355f"><span>Primary</span></label>
      <label class="color-mini"><input id="accentColor" type="color" value="#d13a4f"><span>Accent</span></label>
      <label class="color-mini"><input id="backgroundColor" type="color" value="#d9d0bf"><span>Background</span></label>
    </div>

    <div class="stat-row">
      <div class="ctrl"><label for="stat1">Stat 1</label><input id="stat1" aria-label="Stat 1" type="text" value="6/6 H/AB" autocomplete="off"></div>
      <div class="ctrl"><label for="stat2">Stat 2</label><input id="stat2" aria-label="Stat 2" type="text" value="3 HOME RUNS" autocomplete="off"></div>
      <div class="ctrl"><label for="stat3">Stat 3</label><input id="stat3" aria-label="Stat 3" type="text" value="10 RBIs" autocomplete="off"></div>
    </div>

    <div class="action-stack">
      <button class="action-btn" id="downloadBtn" title="Download PNG" aria-label="Download PNG">⇩</button>
      <button class="action-btn" id="resetBtn" title="Reset graphic" aria-label="Reset graphic">↶</button>
    </div>
  </section>

  <section class="preview-block">
    <div class="preview-top"><span>Live preview</span><span>1080 × 1080 PNG</span></div>
    <div class="preview-wrap"><div class="preview-frame"><svg id="graphic" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Player stat graphic"></svg></div></div>
  </section>
</div></main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const THEMES={
  reference:{name:"Reference (Storm)",teamLabel:"STORM",jersey:"#5f31a6",textFill:"#ffffff",textStroke:"#f0c419",boxValue:"#5f31a6",boxLabel:"#f0c419",boxStroke:"#f0c419"},
  storm:{name:"Storm",teamLabel:"STORM",jersey:"#5f31a6",textFill:"#ffffff",textStroke:"#f0c419",boxValue:"#5f31a6",boxLabel:"#f0c419",boxStroke:"#f0c419"},
  zyns:{name:"Zyns",teamLabel:"ZYNS",jersey:"#a5d5ee",textFill:"#ffffff",textStroke:"#77808a",boxValue:"#6c7480",boxLabel:"#97c5e3",boxStroke:"#77808a"},
  "goofy-goobers":{name:"Goofy Goobers",teamLabel:"GOOFY GOOBERS",jersey:"#111111",textFill:"#d56e24",textStroke:"#ffffff",boxValue:"#111111",boxLabel:"#d56e24",boxStroke:"#d56e24"},
  "ball-busters":{name:"Ball Busters",teamLabel:"BALL BUSTERS",jersey:"#ffffff",textFill:"#b4202d",textStroke:"#111111",boxValue:"#b4202d",boxLabel:"#111111",boxStroke:"#b4202d"},
  "stiff-wifflers":{name:"Stiff Wifflers",teamLabel:"STIFF WIFFLERS",jersey:"#17345f",textFill:"#ffffff",textStroke:"#1f6c4c",boxValue:"#17345f",boxLabel:"#1f6c4c",boxStroke:"#1f6c4c"},
  underdawgs:{name:"Underdawgs",teamLabel:"UNDERDAWGS",jersey:"#6d48a9",textFill:"#8fbee6",textStroke:"#ffffff",boxValue:"#6d48a9",boxLabel:"#8fbee6",boxStroke:"#8fbee6"},
  silverbacks:{name:"Silverbacks",teamLabel:"SILVERBACKS",jersey:"#111111",textFill:"#c9a446",textStroke:"#ffffff",boxValue:"#111111",boxLabel:"#c9a446",boxStroke:"#c9a446"},
  "dirty-dawgs":{name:"Dirty Dawgs",teamLabel:"DIRTY DAWGS",jersey:"#6b2438",textFill:"#b78a35",textStroke:"#ffffff",boxValue:"#6b2438",boxLabel:"#b78a35",boxStroke:"#b78a35"},
  "twin-titans":{name:"Twin Titans",teamLabel:"TWIN TITANS",jersey:"#ffffff",textFill:"#c1272d",textStroke:"#2454c6",boxValue:"#c1272d",boxLabel:"#2454c6",boxStroke:"#2454c6"},
  midnight:{name:"Midnight",teamLabel:"MIDNIGHT",jersey:"#111111",textFill:"#ffffff",textStroke:"#7b828a",boxValue:"#111111",boxLabel:"#7b828a",boxStroke:"#7b828a"},
  custom:{name:"Custom colors…",teamLabel:"TEAM NAME",jersey:"#5f31a6",textFill:"#ffffff",textStroke:"#f0c419",boxValue:"#5f31a6",boxLabel:"#f0c419",boxStroke:"#f0c419"}
};

const DEFAULT={team:"storm",name:"SHARKEY",number:"17",stats:["6/6 H/AB","3 HOME RUNS","10 RBIs"],custom:{primary:"#5f31a6",accent:"#ffffff",background:"#f0c419"}};
let state=structuredClone(DEFAULT);

function theme(){
  if(state.team==="custom"){
    return {
      name:"Custom colors…",
      teamLabel:"TEAM NAME",
      jersey:state.custom.primary,
      textFill:state.custom.accent,
      textStroke:state.custom.background,
      boxValue:state.custom.primary,
      boxLabel:state.custom.background,
      boxStroke:state.custom.background
    };
  }
  return THEMES[state.team]||THEMES.storm;
}
function teamLabel(){return (theme().teamLabel||THEMES.reference.teamLabel).toUpperCase()}
function splitStat(raw){
  const s=String(raw||"").trim();
  if(!s)return ["",""];
  const parts=s.split(/\s+/);
  if(parts.length===1)return [parts[0],""];
  return [parts[0],parts.slice(1).join(" ")];
}
function buildTeamOptions(){
  const sel=$("#team");
  const order=["storm","zyns","goofy-goobers","ball-busters","stiff-wifflers","underdawgs","silverbacks","dirty-dawgs","twin-titans","midnight","custom"];
  sel.innerHTML=order.map(id=>`<option value="${id}">${esc(THEMES[id].name.toUpperCase())}</option>`).join("");
  sel.value=state.team==="reference"?"storm":state.team;
}
function jerseyPath(){
  return `M 146 145
    C 172 118 206 100 248 83
    L 389 26
    C 414 15 434 15 458 21
    C 510 32 569 34 625 27
    C 646 24 660 16 677 18
    C 697 23 714 35 735 45
    L 867 101
    C 906 117 936 136 951 160
    L 1077 377
    L 1077 589
    L 896 698
    L 896 1080
    L 187 1080
    L 187 697
    L 6 589
    L 6 378
    L 126 181
    C 132 165 139 153 146 145 Z`;
}
function statCard(x,y,w,h,value,label,t){
  return `<g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#ffffff" stroke="${t.boxStroke}" stroke-width="5"/>
    <rect x="${x+16}" y="${y+16}" width="18" height="18" rx="4" fill="${t.boxStroke}"/>
    <rect x="${x+w-34}" y="${y+16}" width="18" height="18" rx="4" fill="${t.boxStroke}" opacity=".18"/>
    <line x1="${x+24}" y1="${y+48}" x2="${x+w-24}" y2="${y+48}" stroke="${t.boxStroke}" stroke-width="2" opacity=".35"/>
    <text x="${x+w/2}" y="${y+86}" fill="${t.boxValue}" text-anchor="middle" font-family="'Arial Black', Impact, Haettenschweiler, sans-serif" font-size="38" font-weight="400">${esc(value||"")}</text>
    <text x="${x+w/2}" y="${y+121}" fill="${t.boxLabel}" text-anchor="middle" font-family="'Arial Black', Impact, Haettenschweiler, sans-serif" font-size="23" font-weight="400" letter-spacing="1">${esc(String(label||"").toUpperCase())}</text>
  </g>`;
}
function render(){
  const t=theme();
  const stats=state.stats.map(splitStat);
  const w=214,h=146,y=816;
  const boxCenters=[282,540,798];
  const xs=boxCenters.map(c=>c-w/2);
  const name=String(state.name||"").toUpperCase();
  const num=String(state.number||"");
  const team=teamLabel();
  const svg=$("#graphic");
  svg.innerHTML=`
    <rect width="1080" height="1080" fill="#ffffff"/>
    <path d="${jerseyPath()}" fill="${t.jersey}" stroke="#000" stroke-width="4"/>

    <text x="540" y="240" fill="${t.textFill}" stroke="${t.textStroke}" stroke-width="12" paint-order="stroke fill" text-anchor="middle" font-family="'Arial Black', Impact, Haettenschweiler, sans-serif" font-size="100" font-weight="400" letter-spacing="1">${esc(name)}</text>
    <text x="540" y="640" fill="${t.textFill}" stroke="${t.textStroke}" stroke-width="8" paint-order="stroke fill" text-anchor="middle" font-family="'Arial Black', Impact, Haettenschweiler, sans-serif" font-size="372" font-weight="400" letter-spacing="-4">${esc(num)}</text>
    <text x="540" y="740" fill="${t.textFill}" stroke="${t.textStroke}" stroke-width="3" paint-order="stroke fill" text-anchor="middle" font-family="'Arial Black', Impact, Haettenschweiler, sans-serif" font-size="50" font-weight="400" letter-spacing="2">${esc(team)}</text>

    ${statCard(xs[0],y,w,h,stats[0][0],stats[0][1],t)}
    ${statCard(xs[1],y,w,h,stats[1][0],stats[1][1],t)}
    ${statCard(xs[2],y,w,h,stats[2][0],stats[2][1],t)}
  `;
  $("#customColors").classList.toggle("show",state.team==="custom");
  $("#team").value=state.team;
  $("#playerName").value=state.name;
  $("#number").value=state.number;
  state.stats.forEach((v,i)=>$("#stat"+(i+1)).value=v);
  $("#primaryColor").value=state.custom.primary;$("#accentColor").value=state.custom.accent;$("#backgroundColor").value=state.custom.background;
}
function save(){try{localStorage.setItem("ndwiffle_simple_graphic_v108",JSON.stringify(state));$("#saveState").textContent="Saved automatically in this browser."}catch{}}
function load(){
  try{
    const raw=localStorage.getItem("ndwiffle_simple_graphic_v108")||localStorage.getItem("ndwiffle_simple_graphic_v107")||localStorage.getItem("ndwiffle_simple_graphic_v106")||localStorage.getItem("ndwiffle_simple_graphic_v105")||"null";
    const s=JSON.parse(raw);
    if(s){
      const stats=Array.isArray(s.stats)?s.stats.slice(0,3):DEFAULT.stats;
      while(stats.length<3)stats.push(DEFAULT.stats[stats.length]);
      state={...structuredClone(DEFAULT),...s,stats,custom:{...DEFAULT.custom,...(s.custom||{})}};
    }
  }catch{}
}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1700)}
function bind(){
  $("#team").onchange=e=>{state.team=e.target.value;save();render()};
  $("#playerName").oninput=e=>{state.name=e.target.value;save();render()};
  $("#number").oninput=e=>{state.number=e.target.value;save();render()};
  for(let i=0;i<3;i++)$("#stat"+(i+1)).oninput=e=>{state.stats[i]=e.target.value;save();render()};
  [["primaryColor","primary"],["accentColor","accent"],["backgroundColor","background"]].forEach(([id,key])=>$("#"+id).oninput=e=>{state.custom[key]=e.target.value;save();render()});
  $("#resetBtn").onclick=()=>{state=structuredClone(DEFAULT);save();buildTeamOptions();render();toast("Graphic reset")};
  $("#downloadBtn").onclick=downloadPNG;
}
async function downloadPNG(){
  const svg=$("#graphic");
  const clone=svg.cloneNode(true); clone.setAttribute("width","1080");clone.setAttribute("height","1080");clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const data=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([data],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob), img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=1080;c.height=1080;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,1080,1080);URL.revokeObjectURL(url);c.toBlob(png=>{const a=document.createElement("a");const safe=(state.name||"player").trim().replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"player";a.href=URL.createObjectURL(png);a.download=`${safe}-stat-graphic.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("PNG downloaded")},"image/png")};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Could not export PNG")};
  img.src=url;
}
load();buildTeamOptions();bind();render();
</script>
</body>
</html>
